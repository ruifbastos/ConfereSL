<style>
/* Layout: ecrã único estilo terminal de armazém — barra verde, etiqueta de morada em destaque, botões grandes para luvas. Tema claro fixo (uso em PDA e escritório). */
:root {
  --verde: #78BE20;        /* acento da marca */
  --verde-esc: #2F7A12;    /* botões e texto sobre claro */
  --verde-claro: #EEF6E4;
  --fundo: #F4F6F1;
  --papel: #FFFFFF;
  --tinta: #1D2A17;
  --tinta-2: #55614F;
  --linha: #D9DFD3;
  --ambar: #E8A200;
  --ambar-claro: #FFF5D6;
  --erro: #C62828;
  --erro-claro: #FDECEA;
  --azul: #1F5FA8;
  --azul-claro: #E7F0FA;
  --etiqueta: #FFE14D;     /* etiqueta amarela de estante */
  --f-ui: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  --f-titulo: "Barlow Condensed", "Arial Narrow", "Barlow", sans-serif;
  --f-cod: "IBM Plex Mono", ui-monospace, "Roboto Mono", Consolas, monospace;
  --raio: 10px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
input, select { font-family: inherit; font-size: 16px; color: var(--tinta); background: var(--papel); }
.cod { font-family: var(--f-cod); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* barra de topo */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--verde-esc); color: #fff;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; }
.topo .marca { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topo .marca .bloco { width: 30px; height: 30px; border-radius: 6px; background: var(--verde); display: grid; place-items: center; flex: none; }
.topo .marca .bloco span { width: 12px; height: 12px; border: 3px solid #fff; border-radius: 2px; }
.topo .marca img { height: 30px; width: auto; }
.topo .icone-app { width: 34px; height: 34px; flex: none; display: block; border-radius: 8px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.35); }
.topo .icone-app svg { width: 100%; height: 100%; display: block; }
.topo h1 .ko { color: var(--verde); }
.topo h1 { font-family: var(--f-titulo); font-size: 20px; margin: 0; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo .sub { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo button.ghost { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; }
.sync { font-size: 12px; font-weight: 700; border-radius: 99px; padding: 4px 10px; background: rgba(255,255,255,.18); color: #fff; white-space: nowrap; }
.sync.pend { background: var(--ambar); color: var(--tinta); }
.sync.err { background: var(--erro); color: #fff; }

.pagina { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.pagina.estreita { max-width: 520px; }

.demo { background: var(--azul-claro); color: var(--azul); border: 1px solid #bcd3ee; border-radius: var(--raio); padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.demo b { color: var(--tinta); }
.demo button { margin-left: auto; background: var(--papel); border: 1px solid #bcd3ee; color: var(--azul); border-radius: 8px; padding: 6px 10px; font-weight: 600; }

.cartao { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; }
h2 { font-family: var(--f-titulo); font-size: 22px; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--tinta-2); margin: 0; font-weight: 700; }
.muted { color: var(--tinta-2); }
.pequeno { font-size: 13px; }

.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-size: 13px; font-weight: 600; color: var(--tinta-2); }
.campo input, .campo select { border: 2px solid var(--linha); border-radius: 8px; padding: 12px; width: 100%; }
.campo input:focus, .campo select:focus { border-color: var(--verde); outline: none; }

.btn { border: 0; border-radius: var(--raio); padding: 14px 16px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn.prim { background: var(--verde-esc); color: #fff; }
.btn.prim:active { background: #24600d; }
.btn.amb { background: var(--ambar); color: var(--tinta); }
.btn.sec { background: var(--papel); color: var(--tinta); border: 2px solid var(--linha); }
.btn.perigo { background: var(--papel); color: var(--erro); border: 2px solid #f0c3c0; }
.btn.peq { min-height: 38px; padding: 8px 12px; font-size: 14px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.grelha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ecrã inicial */
.escolha { display: grid; gap: 12px; }
.escolha button { text-align: left; background: var(--papel); border: 2px solid var(--linha); border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: center; color: var(--tinta); }
.escolha button:hover { border-color: var(--verde); }
.escolha .ic { width: 52px; height: 52px; border-radius: 12px; background: var(--verde-claro); display: grid; place-items: center; flex: none; }
.escolha .ic svg { width: 28px; height: 28px; stroke: var(--verde-esc); fill: none; stroke-width: 2; }
.escolha b { font-size: 18px; display: block; }

/* lista de contagens no PDA */
.lista { display: flex; flex-direction: column; gap: 10px; }
.item-cont { text-align: left; width: 100%; background: var(--papel); border: 2px solid var(--linha); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--tinta); }
.item-cont:hover { border-color: var(--verde); }
.item-cont b { font-size: 18px; }

/* ===== ecrã de leitura ===== */
.leitor { position: relative; }
.leitor input { width: 100%; border: 3px dashed var(--verde); border-radius: 12px; padding: 14px 52px 14px 14px; font-family: var(--f-cod); font-size: 18px; background: var(--papel); }
.leitor input:focus { outline: none; border-style: solid; }
.leitor .tec { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--verde-claro); border: 0; border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; }
.leitor .tec svg { width: 22px; height: 22px; stroke: var(--verde-esc); fill: none; stroke-width: 2; }
.leitor .tec.on { background: var(--verde-esc); }
.leitor .tec.on svg { stroke: #fff; }

.leitor.com-cam input { padding-right: 96px; }
.leitor .cam-bt { right: 52px; }
.camara { position: relative; background: #0d130b; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-height: 42vh; width: 100%; max-width: 100%; }
.camara video { width: 100%; height: 100%; object-fit: cover; display: block; }
.camara .mira { position: absolute; left: 8%; right: 8%; top: 50%; height: 2px; background: #ff3b30; box-shadow: 0 0 8px #ff3b30; transform: translateY(-50%); }
.camara .moldura { position: absolute; left: 6%; right: 6%; top: 28%; bottom: 28%; border: 2px solid rgba(255,255,255,.75); border-radius: 10px; }
.camara.lido .moldura { border-color: var(--verde); box-shadow: 0 0 0 4px rgba(120,190,32,.45) inset; }
.camara .barra-cam { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; padding: 8px; justify-content: space-between; align-items: center; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
.camara .barra-cam button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 700; }
.camara .barra-cam button.on { background: var(--etiqueta); color: var(--tinta); }
.camara .ultimo { color: #fff; font-family: var(--f-cod); font-size: 12px; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; text-align: center; }
.msg { border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 16px; display: flex; gap: 10px; align-items: flex-start; }
.msg.ok { background: var(--verde-claro); color: var(--verde-esc); }
.msg.err { background: var(--erro-claro); color: var(--erro); }
.msg.av { background: var(--ambar-claro); color: #7a5300; }
.msg.info { background: var(--papel); color: var(--tinta-2); border: 1px solid var(--linha); font-weight: 500; }
@keyframes pisca { 0% { transform: scale(1.02); } 100% { transform: scale(1); } }
.msg.novo { animation: pisca .25s ease-out; }

.morada-atual { background: var(--papel); border: 2px solid var(--linha); border-radius: 14px; overflow: hidden; }
.morada-atual.ativa { border-color: var(--tinta); }
.etq { background: var(--etiqueta); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 2px solid var(--tinta); }
.etq .rot { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #5c4a00; }
.segs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.segs span { font-family: var(--f-cod); font-weight: 600; font-size: 22px; background: var(--tinta); color: var(--etiqueta); border-radius: 4px; padding: 1px 7px; }
.segs i { font-style: normal; font-weight: 700; color: var(--tinta); }
.etq.vazia-etq { background: #ECEFE8; border-bottom-color: var(--linha); }
.etq.vazia-etq .rot { color: var(--tinta-2); }
.corpo-morada { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.paletes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.paletes li { display: flex; align-items: center; gap: 10px; background: var(--verde-claro); border-radius: 8px; padding: 8px 10px; }
.paletes li .n { font-weight: 700; color: var(--verde-esc); width: 22px; }
.paletes li .cod { font-size: 15px; }

.escolha-loja { display: flex; flex-direction: column; gap: 8px; border: 2px solid var(--azul); }
.grelha-lojas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grelha-lojas .btn { min-height: 54px; font-size: 17px; }
.acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acoes .btn { min-height: 58px; font-size: 18px; }
.acoes-sec { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--papel); border: 1px solid var(--linha); border-radius: 10px; padding: 8px; text-align: center; }
.stats b { display: block; font-size: 22px; font-family: var(--f-titulo); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--tinta-2); text-transform: uppercase; letter-spacing: .05em; }

.ultimas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ultimas li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
.ultimas li:last-child { border-bottom: 0; }
.ultimas .cod { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; white-space: nowrap; text-transform: uppercase; letter-spacing: .04em; }
.pill.ok { background: var(--verde-claro); color: var(--verde-esc); }
.pill.pend { background: var(--ambar-claro); color: #7a5300; }
.pill.err { background: var(--erro-claro); color: var(--erro); }
.pill.cinza { background: #ECEFE8; color: var(--tinta-2); }
.pill.azul { background: var(--azul-claro); color: var(--azul); }

.exemplos { display: flex; flex-wrap: wrap; gap: 6px; }
.exemplos button { font-family: var(--f-cod); font-size: 12px; border: 1px dashed #9fb6d3; background: var(--papel); color: var(--azul); border-radius: 6px; padding: 5px 8px; }

/* ===== backoffice ===== */
.linha-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.linha-acoes .esp { flex: 1; }
.chips-cor { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-cor { display: inline-flex; }
.grupo-cor { display: inline-flex; align-items: stretch; gap: 4px; padding: 4px; border: 1px solid var(--linha); border-radius: 12px; background: var(--fundo, #F4F6F1); }
.grupo-cor .chip-cor span { height: 100%; justify-content: center; }
.grupo-cor .tit-cor { display: flex; flex-direction: column; justify-content: center; border: 0; background: none; font: inherit; font-weight: 700; padding: 4px 8px; cursor: pointer; text-align: left; color: inherit; }
.grupo-cor .tit-cor small { font-weight: 500; font-size: 11px; color: var(--tinta-2); }
.chip-cor.lado span { padding: 8px 12px; }
.topo .marca { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.chip-cor input { position: absolute; opacity: 0; pointer-events: none; }
.chip-cor span { display: flex; flex-direction: column; border: 2px solid var(--linha); border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; background: var(--papel); }
.chip-cor span small { font-weight: 500; font-size: 11px; color: var(--tinta-2); }
.chip-cor input:checked + span { border-color: var(--verde-esc); background: var(--verde-claro); }
.chip-cor input:focus-visible + span { outline: 3px solid var(--azul); outline-offset: 2px; }
.ficheiros-lojas { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.fich-loja { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; background: var(--papel); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fich-loja.falta { border-style: dashed; background: var(--ambar-claro); border-color: #f1d98c; }
.fich-loja .nome { font-size: 12px; color: var(--tinta-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.form-nova { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
.tabela-wrap { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--papel); }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-2); background: #F7F9F4; padding: 9px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap; position: sticky; top: 0; }
table.t td { padding: 9px 10px; border-bottom: 1px solid #EBEFE7; vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.clic { cursor: pointer; }
table.t tr.clic:hover td { background: #F7FAF3; }
table.t td.cod { white-space: nowrap; }
table.t td.art { max-width: 340px; color: var(--tinta-2); font-size: 13px; }
.vazio-t { padding: 28px; text-align: center; color: var(--tinta-2); }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi b { font-family: var(--f-titulo); font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-2); font-weight: 600; }
.kpi.alerta { border-color: #f0c3c0; background: var(--erro-claro); }
.kpi.alerta b { color: var(--erro); }
.kpi.aviso { border-color: #f1d98c; background: var(--ambar-claro); }
.kpi.aviso b { color: #7a5300; }
.kpi.bom b { color: var(--verde-esc); }
.barra { height: 8px; border-radius: 99px; background: #E3E8DE; overflow: hidden; }
.barra > div { height: 100%; background: var(--verde); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--linha); }
.tabs button { background: none; border: 0; padding: 10px 12px; font-weight: 600; color: var(--tinta-2); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button.on { color: var(--tinta); border-bottom-color: var(--verde-esc); }
.tabs .cnt { font-size: 12px; background: #ECEFE8; border-radius: 99px; padding: 1px 7px; margin-left: 4px; }
.tabs button.on .cnt { background: var(--verde-claro); color: var(--verde-esc); }
.filtro { border: 2px solid var(--linha); border-radius: 8px; padding: 9px 12px; min-width: 0; width: 260px; max-width: 100%; }

.info-ficheiro { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--raio); border: 1px dashed var(--linha); background: var(--papel); }
.info-ficheiro.falta { border-color: var(--ambar); background: var(--ambar-claro); }

/* modal */
.veu { position: fixed; inset: 0; z-index: 50; background: rgba(20,28,16,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--papel); border-radius: 14px; max-width: 460px; width: 100%; padding: 18px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow: auto; }
.modal.larga { max-width: 900px; }
.modal h2 { font-size: 22px; }
.modal .botoes { display: flex; flex-direction: column; gap: 8px; }
.modal .botoes.lado { flex-direction: row; flex-wrap: wrap; justify-content: flex-end; }
.modal iframe { width: 100%; height: 65vh; border: 1px solid var(--linha); border-radius: 8px; background: #fff; }
.modal.erro { border-top: 6px solid var(--erro); }
.modal.aviso { border-top: 6px solid var(--ambar); }

/* mapa do armazém */
.mapa-legenda { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.mapa-legenda span { display: inline-flex; align-items: center; gap: 6px; }
.mapa-legenda i { width: 16px; height: 14px; border-radius: 3px; display: inline-block; }
.corredores { display: flex; flex-direction: column; gap: 14px; }
.corredor { background: var(--papel); border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.corredor-cab { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.corredor-cab h3 { font-family: var(--f-titulo); font-size: 20px; color: var(--tinta); letter-spacing: .01em; text-transform: none; }
.corredor-cab .num { font-size: 13px; color: var(--tinta-2); }
.rack-scroll { overflow-x: auto; padding-bottom: 4px; }
.rack { display: grid; gap: 3px; width: max-content; }

/* ---------- normalização e classificação de códigos ---------- */

function normalizarSscc(txt) {
  var s = String(txt == null ? '' : txt).replace(/[\x00-\x1f\x7f]/g, '').trim().replace(/^\]C1/i, '').replace(/\D/g, '');
  if (s.length === 20 && s.indexOf('00') === 0) s = s.substring(2);
  return s.length === 18 ? s : '';
}

function normalizarMorada(txt) {
  return String(txt == null ? '' : txt).trim().toUpperCase().replace(/\s+/g, '');
}

/** Devolve {tipo:'sscc'|'morada'|'invalido', valor} */
function classificarCodigo(txt, regexMorada) {
  // remove carateres de controlo (FNC1/GS dos códigos GS1-128 lidos pela câmara)
  var bruto = String(txt == null ? '' : txt).replace(/[\x00-\x1f\x7f]/g, '').trim();
  if (!bruto) return { tipo: 'invalido', valor: '' };
  var soDigitos = bruto.replace(/^\]C1/i, '');
  if (/^\d+$/.test(soDigitos)) {
    var s = normalizarSscc(soDigitos);
    if (s) return { tipo: 'sscc', valor: s };
    return { tipo: 'invalido', valor: bruto };
  }
  var m = normalizarMorada(bruto);
  var re;
  try { re = new RegExp(regexMorada || CONFIG_PADRAO[2][1]); } catch (e) { re = new RegExp(CONFIG_PADRAO[2][1]); }
  if (re.test(m)) return { tipo: 'morada', valor: m };
  return { tipo: 'invalido', valor: bruto };
}

/** Ordenação natural de moradas: 04-SL-90-... antes de 04-SL-100-... */
function compararMoradas(a, b) {
  var pa = String(a || '').split('-'), pb = String(b || '').split('-');
  for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
    var x = pa[i] || '', y = pb[i] || '';
    var nx = /^\d+$/.test(x), ny = /^\d+$/.test(y);
    if (nx && ny) { if (+x !== +y) return +x - +y; }
    else if (x !== y) return x < y ? -1 : 1;
  }
  return 0;
}

/* ---------- espaços (zonas e nº de posições por loja) ---------- */

function chaveLoja_(l) { return String(l || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase(); }

/** Zona a que pertence a morada (prefixo mais longo que encaixa). espacos = [{zona, prefixo, posicoes}] */
function zonaDe(morada, espacos) {
  var m = normalizarMorada(morada), melhor = null;
  (espacos || []).forEach(function (z) {
    var p = normalizarMorada(z.prefixo);
    if (!p) return;
    if ((m === p || m.indexOf(p + '-') === 0) && (!melhor || p.length > normalizarMorada(melhor.prefixo).length)) melhor = z;
  });
  return melhor;
}

/* ---------- âmbito da auditoria (corredores) ---------- */

/** Um corredor pode ser só de um lado: "04-SL-100:P" (colunas pares) ou "04-SL-100:I" (ímpares).
    Devolve {pref, lado:''|'P'|'I'} */
function partesCorredor(tok) {
  var t = normalizarMorada(tok).replace(/[\/#]/g, ':');
  var m = /^(.*?):(P|I|PAR|PARES|IMPAR|IMPARES|ÍMPAR|ÍMPARES)$/.exec(t);
  if (!m) return { pref: t, lado: '' };
  return { pref: m[1], lado: m[2].charAt(0) === 'P' ? 'P' : 'I' };
}
/** Lado ('P'/'I') da coluna a seguir ao prefixo do corredor; '' se não der para saber */
function ladoDaMorada(morada, pref) {
  var m = normalizarMorada(morada);
  if (m.indexOf(pref + '-') !== 0) return '';
  var col = parseInt(m.substring(pref.length + 1).split('-')[0], 10);
  return isNaN(col) ? '' : (col % 2 ? 'I' : 'P');
}
/** "04-SL-90, 04-SL-100:P" -> ['04-SL-90','04-SL-100:P'] (pares + ímpares do mesmo corredor = corredor inteiro) */
function listaCorredores(txt) {
  var l = Array.isArray(txt) ? txt : String(txt || '').split(/[,;\s]+/);
  var lados = {}, ordem = [];
  l.forEach(function (c) {
    var x = partesCorredor(c);
    if (!x.pref) return;
    if (!lados[x.pref]) { lados[x.pref] = {}; ordem.push(x.pref); }
    lados[x.pref][x.lado || 'T'] = 1;
  });
  return ordem.sort(compararMoradas).map(function (p) {
    var s = lados[p];
    if (s.T || (s.P && s.I)) return p;
    return p + ':' + (s.P ? 'P' : 'I');
  });
}
/** A morada pertence a um dos corredores (ou a lista está vazia = sem limite) */
function dentroDosCorredores(morada, corredores) {
  if (!corredores || !corredores.length) return true;
  var m = normalizarMorada(morada);
  return corredores.some(function (tok) {
    var x = partesCorredor(tok), p = x.pref;
    if (m === p || p.indexOf(m + '-') === 0) return true;

function nomeApp_(c) { var n = String((c && c.NOME_APP) || '').trim(); return !n || /^morako$/i.test(n) ? 'GSL' : n; }
/** Nome curto: "04-SL-90, 04-SL-100:P" -> "Corredores 90 e 100 pares" */

/* ---------- tipos de palete e racks ---------- */

/** tipos = [{codigo, nome, espacos}] ; devolve o tipo (ou um tipo genérico de 1 espaço) */
function tipoPalete(codigo, tipos) {
  var c = String(codigo || '').split(';')[0].trim().toUpperCase();
  var t = (tipos || []).filter(function (x) { return String(x.codigo).toUpperCase() === c; })[0];
  return t || { codigo: c, nome: c || 'Sem tipo', espacos: 1, desconhecido: true };
}

/** "95-99:00,10; 51:30" -> { '95|00':1, '97|00':1, ... } (colunas com o mesmo passo do lado) */
function posicoesInexistentes(txt, passo) {
  var out = {};
  String(txt || '').split(';').forEach(function (parte) {
    var p = parte.split(':');
    if (p.length < 2) return;
    var niveis = p[1].split(',').map(function (n) { return n.trim(); }).filter(String);
    p[0].split(',').forEach(function (faixa) {
      var ab = faixa.trim().split('-').map(function (x) { return parseInt(x, 10); });
      if (isNaN(ab[0])) return;
      var a = ab[0], b = isNaN(ab[1]) ? ab[0] : ab[1];
      for (var c = Math.min(a, b); c <= Math.max(a, b); c += (passo || 2)) niveis.forEach(function (n) { out[c + '|' + (+n)] = 1; });
    });
  });
  return out;
}

/** Divide as colunas de uma rack em vãos. r.vaos = "4x12, 3, 4x12" (moradas por vão, da 1.ª coluna para a última);
    o que sobrar usa r.moradasVao (por omissão 4). Devolve [[col, col, ...], ...] */
function vaosDaRack(r, cols) {
  var seq = [];
  String((r && r.vaos) || '').split(/[,;]/).forEach(function (p) {
    var m = p.trim().toLowerCase().match(/^(\d+)\s*(?:x\s*(\d+))?$/);
    if (!m) return;
    var tam = parseInt(m[1], 10), n = m[2] ? parseInt(m[2], 10) : 1;
    for (var i = 0; i < n; i++) seq.push(tam);

  var omissao = Math.max(1, parseInt(r && r.moradasVao, 10) || 4);
  var vaos = [], i = 0, k = 0;
  while (i < cols.length) {
    var tam = Math.max(1, seq[k++] || omissao);
    vaos.push(cols.slice(i, i + tam));
    i += tam;
  }
  return vaos;
}

/** Nº de espaços de uma rack configurada (uma morada = um espaço) */
function espacosRack(r) { return posicoesRack(r); }

/** Nº de posições físicas de uma rack configurada */
function posicoesRack(r) {
  var ini = parseInt(r.colunaInicial, 10), fim = parseInt(r.colunaFinal, 10);
  if (isNaN(ini) || isNaN(fim)) return 0;
  var niveis = String(r.niveis || '').split(',').map(function (n) { return n.trim(); }).filter(String);
  var sem = posicoesInexistentes(r.semPosicao, 2);
  var n = 0;
  for (var c = Math.min(ini, fim); c <= Math.max(ini, fim); c += 2) niveis.forEach(function (nv) { if (!sem[c + '|' + (+nv)]) n++; });
  return n;
}

/* ---------- motor de comparação ---------- */

/**
 * leituras: linhas ativas da tabela Leituras  {Morada, Estado, SSCC, Operador, DataHora}
 * referencia: linhas da tabela Referencia      {SSCC, Morada, TipoPalete, Artigos, ...}
 */
function calcularResultado(leituras, referencia, espacos, tipos) {
  espacos = espacos || [];
  function espacosSscc(s) { var r = refPorSsccG[s]; return tipoPalete(r ? r.TipoPalete : '', tipos).espacos; }
  var refPorSsccG = {};
  referencia.forEach(function (r) { refPorSsccG[r.SSCC] = r; });
  var temRef = referencia.length > 0;
  var refPorSscc = {}, refPorMorada = {};
  referencia.forEach(function (r) {
    refPorSscc[r.SSCC] = r;
    (refPorMorada[r.Morada] = refPorMorada[r.Morada] || []).push(r.SSCC);
  });

  var moradasLidas = {};     // morada -> {estado, operador, dataHora, sscc:[]}
  var lidasPorSscc = {};     // sscc -> [ {morada, operador, dataHora} ]
  leituras.forEach(function (l) {
    var m = moradasLidas[l.Morada] = moradasLidas[l.Morada] ||
      { estado: l.Estado, operador: l.Operador, dataHora: l.DataHora, sscc: [] };
    if (l.Estado === 'PALETE' && l.SSCC) {
      m.estado = 'PALETE';
      m.sscc.push(l.SSCC);
      (lidasPorSscc[l.SSCC] = lidasPorSscc[l.SSCC] || []).push({ morada: l.Morada, operador: l.Operador, dataHora: l.DataHora, loja: l.Loja || '' });
    }
  });

  var linhas = [];
  function linha(res, sscc, mSis, mLida, op, dh, ref, lojaLida) {
    var lojaSis = ref && ref.Loja ? ref.Loja : '';
    linhas.push({
      resultado: res, sscc: sscc || '', moradaSistema: mSis || '', moradaLida: mLida || '',
      operador: op || '', dataHora: dh || '',
      loja: lojaSis || lojaLida || '', lojaLida: lojaLida || '',
      lojaDiferente: !!(lojaSis && lojaLida && chaveLoja_(lojaSis) !== chaveLoja_(lojaLida)),
      tipoPalete: ref ? ref.TipoPalete : '', artigos: ref ? ref.Artigos : '',
      numArtigos: ref ? ref.NumArtigos : '', qtdTotal: ref ? ref.QtdTotal : ''
    });
  }

  var todos = {};
  Object.keys(refPorSscc).forEach(function (s) { todos[s] = 1; });
  Object.keys(lidasPorSscc).forEach(function (s) { todos[s] = 1; });

  Object.keys(todos).forEach(function (s) {
    var ref = refPorSscc[s];
    var lidas = lidasPorSscc[s] || [];
    var mSis = ref ? ref.Morada : '';
    if (lidas.length > 1) {
      lidas.forEach(function (l) { linha('DUPLICADA', s, mSis, l.morada, l.operador, l.dataHora, ref, l.loja); });
      return;
    }
    var l = lidas[0];
    if (ref && l) {
      linha(l.morada === mSis ? 'OK' : 'FORA_SITIO', s, mSis, l.morada, l.operador, l.dataHora, ref, l.loja);
    } else if (ref && !l) {
      var visitada = moradasLidas[mSis];
      if (visitada) linha('EM_FALTA', s, mSis, '', visitada.operador, visitada.dataHora, ref);
      else linha('NAO_CONFERIDA', s, mSis, '', '', '', ref);
    } else if (!ref && l) {
      linha(temRef ? 'SEM_REGISTO' : 'OK', s, '', l.morada, l.operador, l.dataHora, null, l.loja);
    }
  });

  // moradas do sistema não visitadas cujas paletes apareceram todas noutro sítio
  Object.keys(refPorMorada).forEach(function (m) {
    if (moradasLidas[m]) return;
    var pendentes = refPorMorada[m].filter(function (s) { return !lidasPorSscc[s]; });
    if (!pendentes.length) linha('NAO_CONFERIDA', '', m, '', '', '', { TipoPalete: '', Artigos: 'Palete do sistema encontrada noutra morada; confirmar se esta morada está vazia', NumArtigos: '', QtdTotal: '' });
  });

  Object.keys(moradasLidas).forEach(function (m) {
    var info = moradasLidas[m];
    if (info.estado === 'VAZIA' && !(refPorMorada[m] || []).length) {
      linha('OK_VAZIA', '', m, m, info.operador, info.dataHora, null);
    }
  });

  linhas.sort(function (a, b) {
    var oa = RESULTADOS[a.resultado].ordem, ob = RESULTADOS[b.resultado].ordem;
    if (oa !== ob) return oa - ob;
    return compararMoradas(a.moradaSistema || a.moradaLida, b.moradaSistema || b.moradaLida);
  });

  // moradas divergentes
  var moradaDiv = {};
  linhas.forEach(function (x) {
    if (!RESULTADOS[x.resultado].div) return;
    if (x.moradaLida) moradaDiv[x.moradaLida] = 1;
    if (x.moradaSistema && moradasLidas[x.moradaSistema]) moradaDiv[x.moradaSistema] = 1;
  });

  var cont = {};
  Object.keys(RESULTADOS).forEach(function (k) { cont[k] = 0; });
  linhas.forEach(function (x) { cont[x.resultado]++; });

  var nLidas = Object.keys(moradasLidas).length;
  var nMoradasDiv = Object.keys(moradaDiv).length;
  var moradasNaoConf = {};
  Object.keys(refPorMorada).forEach(function (m) { if (!moradasLidas[m]) moradasNaoConf[m] = 1; });

  // por operador
  var ops = {};
  Object.keys(moradasLidas).forEach(function (m) {
    var i = moradasLidas[m];
    var o = ops[i.operador] = ops[i.operador] || { operador: i.operador, moradas: 0, paletes: 0, vazias: 0, divergentes: 0, inicio: i.dataHora, fim: i.dataHora };

  });

  // por loja (armazém multiloja)

    var o = lojasR[k] = lojasR[k] || { loja: k, sistema: 0, lidas: 0, ok: 0, foraSitio: 0, emFalta: 0, semRegisto: 0, duplicadas: 0, naoConferidas: 0, lojaDiferente: 0, espacosLidos: 0, espacosSistema: 0 };
    if (x.resultado !== 'SEM_REGISTO' && (x.moradaSistema || x.resultado === 'NAO_CONFERIDA')) o.espacosSistema += espacosSscc(x.sscc);
    if (x.moradaLida) o.espacosLidos += espacosSscc(x.sscc);
    if (x.resultado !== 'SEM_REGISTO' && (x.moradaSistema || x.resultado === 'NAO_CONFERIDA')) o.sistema++;
    if (x.moradaLida) o.lidas++;
    if (x.resultado === 'OK') o.ok++;
    if (x.resultado === 'FORA_SITIO') o.foraSitio++;
    if (x.resultado === 'EM_FALTA') o.emFalta++;
    if (x.resultado === 'SEM_REGISTO') o.semRegisto++;
    if (x.resultado === 'DUPLICADA') o.duplicadas++;
    if (x.resultado === 'NAO_CONFERIDA') o.naoConferidas++;

  // por zona (espaços do armazém)
  var zonas = [], porZona = {}, totalPos = 0;
  espacos.forEach(function (z) {
    var k = normalizarMorada(z.prefixo);
    totalPos += +z.posicoes || 0;
    porZona[k] = { zona: z.zona || k, prefixo: k, posicoes: +z.posicoes || 0, conferidas: 0, comPalete: 0, espacosOcupados: 0, vazias: 0, divergentes: 0, noSistema: 0, porConferir: 0 };
    zonas.push(porZona[k]);
  });
  var fora = { zona: 'Fora das zonas definidas', prefixo: '', posicoes: 0, conferidas: 0, comPalete: 0, espacosOcupados: 0, vazias: 0, divergentes: 0, noSistema: 0, porConferir: 0 };
  function espacosMoradaLida(m) { return moradasLidas[m].sscc.reduce(function (s, x) { return s + espacosSscc(x); }, 0); }
  function espacosMoradaSistema(m) { return (refPorMorada[m] || []).reduce(function (s, x) { return s + espacosSscc(x); }, 0); }
  function zonaObj(m) { var z = zonaDe(m, espacos); return z ? porZona[normalizarMorada(z.prefixo)] : fora; }
  if (espacos.length) {
    Object.keys(moradasLidas).forEach(function (m) {
      var z = zonaObj(m); z.conferidas++;
      if (moradasLidas[m].estado === 'VAZIA') z.vazias++; else { z.comPalete++; z.espacosOcupados += espacosMoradaLida(m); }
      if (moradaDiv[m]) z.divergentes++;

    Object.keys(refPorMorada).forEach(function (m) { var z = zonaObj(m); z.noSistema++; if (!moradasLidas[m]) z.porConferir++; });
    zonas.forEach(function (z) {
      z.cobertura = z.posicoes ? Math.round(z.conferidas / z.posicoes * 1000) / 10 : null;
      z.ocupacao = z.posicoes ? Math.round(z.espacosOcupados / z.posicoes * 1000) / 10 : null;

  var espacosSistema = Object.keys(refPorMorada).reduce(function (s, m) { return s + espacosMoradaSistema(m); }, 0);

  return {
    zonas: zonas,
    espacos: {

      posicoes: totalPos,
      cobertura: totalPos ? Math.round(nLidas / totalPos * 1000) / 10 : null,
      ocupacao: totalPos ? Math.round(comPaleteTotal / totalPos * 1000) / 10 : null,
      ocupacaoSistema: totalPos && temRef ? Math.round(espacosSistema / totalPos * 1000) / 10 : null,
      espacosOcupados: comPaleteTotal,
      espacosSistema: espacosSistema,
      foraDasZonas: espacos.length ? fora.conferidas : 0

      moradasConferidas: nLidas,
      moradasVazias: Object.keys(moradasLidas).filter(function (m) { return moradasLidas[m].estado === 'VAZIA'; }).length,
      paletesLidas: Object.keys(lidasPorSscc).length,
      moradasDivergentes: nMoradasDiv,
      moradasNaoConferidas: Object.keys(moradasNaoConf).length,
      divergencias: cont.FORA_SITIO + cont.EM_FALTA + cont.SEM_REGISTO + cont.DUPLICADA,
      taxaAcerto: nLidas ? Math.round((nLidas - nMoradasDiv) / nLidas * 1000) / 10 : null,
      progresso: temRef && Object.keys(refPorMorada).length
        ? Math.round((Object.keys(refPorMorada).length - Object.keys(moradasNaoConf).length) / Object.keys(refPorMorada).length * 1000) / 10 : null
    },
    operadores: Object.keys(ops).map(function (k) { return ops[k]; }).sort(function (a, b) { return b.moradas - a.moradas; }),
    porLoja: Object.keys(lojasR).sort().map(function (k) { return lojasR[k]; }),
    lojaDiferente: linhas.filter(function (x) { return x.lojaDiferente; }).length

}

var RE_MORADA_LISTA = /\b\d{2}-[A-Z]{1,3}-\d{1,3}-\d{1,3}-\d{2}-\d{1,2}\b/g;

/** Importa a lista de moradas existentes.
    modo 'adicionar' (por omissão): junta às moradas já guardadas, sem apagar nenhuma.
    modo 'substituir': substitui as moradas dos corredores presentes na lista. */
function importarMoradas(lista, por, modo) {
  var vistas = {}, novas = [];
  (lista || []).forEach(function (m) {
    m = normalizarMorada(m);
    if (!m || vistas[m]) return;
    if (!new RegExp(RE_MORADA_LISTA.source).test(m)) return;
    vistas[m] = 1;
    novas.push({ Morada: m, Corredor: corredorDaMorada_(m) });
  });
  if (!novas.length) throw new Error('Não encontrei moradas na lista (formato esperado: 04-SL-100-54-30-1).');
  var cors = {};
  novas.forEach(function (r) { cors[r.Corredor] = (cors[r.Corredor] || 0) + 1; });
  return REPO.comLock(function () {
    var atuais;
    try { atuais = REPO.ler('Moradas'); } catch (e) { throw new Error('Falta a aba Moradas. Execute a função instalar() no editor.'); }
    if (modo === 'substituir') {
      var resto = atuais.filter(function (r) { return !cors[r.Corredor]; });
      novas.sort(function (a, b) { return compararMoradas(a.Morada, b.Morada); });
      REPO.reescrever('Moradas', resto.concat(novas));
      return { modo: 'substituir', adicionadas: novas.length, jaExistiam: 0, corredores: cors };
    }
    var existe = {};
    atuais.forEach(function (r) { existe[r.Morada] = 1; });
    var acrescentar = novas.filter(function (r) { return !existe[r.Morada]; });
    if (acrescentar.length) {
      var todas = atuais.concat(acrescentar).map(function (r) { return { Morada: r.Morada, Corredor: r.Corredor }; });
      todas.sort(function (a, b) { return compararMoradas(a.Morada, b.Morada); });
      REPO.reescrever('Moradas', todas);
    }
    return { modo: 'adicionar', adicionadas: acrescentar.length, jaExistiam: novas.length - acrescentar.length, corredores: cors };
  });
}
/** Apaga só as moradas indicadas (as outras ficam) */
function removerMoradas(lista, por) {
  var tirar = {};
  (lista || []).forEach(function (m) { tirar[normalizarMorada(m)] = 1; });
  return REPO.comLock(function () {
    var atuais = REPO.ler('Moradas');
    var resto = atuais.filter(function (r) { return !tirar[r.Morada]; });
    if (resto.length !== atuais.length) REPO.reescrever('Moradas', resto.map(function (r) { return { Morada: r.Morada, Corredor: r.Corredor }; }));
    return atuais.length - resto.length;
  });
}
function apagarMoradasCorredor(corredor, por) {
  var c = normalizarMorada(corredor);
  return REPO.comLock(function () {
    REPO.reescrever('Moradas', REPO.ler('Moradas').filter(function (r) { return r.Corredor !== c; }));
    return true;
  });
}
/** Resumo da lista de moradas por corredor e lado */
function resumoMoradas_(moradas) {
  var cfg = lerConfig_();
  var sg = String(cfg.MAPA_SEGMENTOS || '3,4,5').split(',').map(function (x) { return (parseInt(x, 10) || 1) - 1; });
  var out = {};
  moradas.forEach(function (m) {
    var p = m.split('-');
    var cor = p.slice(0, sg[0] + 1).join('-'), col = +p[sg[1]], nv = p[sg[2]];
    var o = out[cor] = out[cor] || { corredor: cor, moradas: 0, lados: {} };
    o.moradas++;
    var lado = col % 2 ? 'Ímpar' : 'Par';
    var L = o.lados[lado] = o.lados[lado] || { lado: lado, min: col, max: col, colunas: {}, niveis: {}, moradas: 0 };
    L.moradas++; L.colunas[col] = 1; L.niveis[nv] = 1;
    if (col < L.min) L.min = col; if (col > L.max) L.max = col;
  });
  return Object.keys(out).sort(compararMoradas).map(function (k) {
    var o = out[k];
    o.lados = Object.keys(o.lados).sort().reverse().map(function (l) {
      var L = o.lados[l];
      return { lado: L.lado, min: L.min, max: L.max, colunas: Object.keys(L.colunas).length, niveis: Object.keys(L.niveis).sort(), moradas: L.moradas };
    });
    return o;
  });
}

/** Configuração física do armazém: racks + tipos de palete + lista de moradas. corredores (opcional) limita */
function obterArmazem(loja, corredores) {
  var racks = racksDaLoja_().filter(function (r) { return r.corredor && ladoNoAmbito(r.corredor, r.lado, corredores); });
  racks.forEach(function (r) { r.posicoes = posicoesRack(r); r.espacos = espacosRack(r); });
  var moradas = moradasArmazem_(corredores);
  return { racks: racks, tipos: tiposPalete_(), moradas: moradas, resumoMoradas: resumoMoradas_(moradas) };
}

function guardarRacks(loja, linhas, por) {
  var limpas = (linhas || []).map(function (l) {
    return { Loja: '', Corredor: normalizarMorada(l.corredor), Lado: /mpar|^i/i.test(l.lado) ? 'Ímpar' : 'Par',
      ColunaInicial: String(parseInt(l.colunaInicial, 10) || ''), ColunaFinal: String(parseInt(l.colunaFinal, 10) || ''),
      Niveis: String(l.niveis || '').split(',').map(function (n) { return n.trim(); }).filter(String).join(','), SemPosicao: String(l.semPosicao || '').trim(),
      MoradasVao: String(Math.max(1, parseInt(l.moradasVao, 10) || 4)), Vaos: String(l.vaos || '').trim() };
  }).filter(function (l) { return l.Corredor; });
  limpas.forEach(function (l) {
    if (!l.ColunaInicial || !l.ColunaFinal) throw new Error('Indique a coluna inicial e final do corredor ' + l.Corredor + ' (' + l.Lado + ').');
    if ((+l.ColunaInicial % 2) !== (+l.ColunaFinal % 2)) throw new Error('No corredor ' + l.Corredor + ', a coluna inicial e a final têm de ser ambas pares ou ambas ímpares.');
    if ((+l.ColunaInicial % 2 === 1) !== (l.Lado === 'Ímpar')) throw new Error('No corredor ' + l.Corredor + ', o lado não corresponde às colunas (' + l.ColunaInicial + ' é ' + (+l.ColunaInicial % 2 ? 'ímpar' : 'par') + ').');
    if (!l.Niveis) throw new Error('Indique os níveis do corredor ' + l.Corredor + ' (ex.: 00,10,20,30).');
  });
  var vistos = {};
  limpas.forEach(function (l) { var k = l.Corredor + '|' + l.Lado; if (vistos[k]) throw new Error('O corredor ' + l.Corredor + ' lado ' + l.Lado + ' está repetido.'); vistos[k] = 1; });
  return REPO.comLock(function () { REPO.reescrever('Racks', limpas); return limpas.length; });
}

function guardarTiposPalete(linhas, por) {
  var limpas = (linhas || []).map(function (l) {
    return { Codigo: String(l.codigo || '').trim().toUpperCase(), Nome: String(l.nome || '').trim(), Espacos: String(Math.max(1, parseInt(l.espacos, 10) || 1)) };
  }).filter(function (l) { return l.Codigo; });
  var vistos = {};
  limpas.forEach(function (l) { if (vistos[l.Codigo]) throw new Error('O código ' + l.Codigo + ' está repetido.'); vistos[l.Codigo] = 1; });
  return REPO.comLock(function () { REPO.reescrever('TiposPalete', limpas); return limpas.length; });
}

/** Substitui os espaços de uma loja. linhas = [{zona, prefixo, posicoes}] */
function guardarEspacos(loja, linhas, por) {
  var limpas = (linhas || []).map(function (l) {
    return { Loja: '', Zona: String(l.zona || '').trim(), Prefixo: normalizarMorada(l.prefixo), Posicoes: String(Math.max(0, parseInt(l.posicoes, 10) || 0)) };
  }).filter(function (l) { return l.Prefixo || l.Zona; });
  limpas.forEach(function (l) {
    if (!l.Prefixo) throw new Error('A zona "' + l.Zona + '" não tem o início da morada (ex.: 04-SL-100).');
    if (!l.Zona) l.Zona = l.Prefixo;
  });
  var pref = {};
  limpas.forEach(function (l) { if (pref[l.Prefixo]) throw new Error('O início de morada ' + l.Prefixo + ' está repetido.'); pref[l.Prefixo] = 1; });
  return REPO.comLock(function () { REPO.reescrever('Espacos', limpas); return limpas.length; });
}

function obterConfigPublica() {

    leitorUrl: c.LEITOR_URL == null ? 'https://ruifbastos.github.io/ConfereSL/leitor.html' : String(c.LEITOR_URL).trim()
  };
}

function validarPin(pin) {
  var c = lerConfig_();
  return String(c.PIN_BACKOFFICE || '').trim() === String(pin || '').trim();
}

function listarContagens(apenasAbertas) {
  var leit = REPO.ler('Leituras');
  var porC = {};
  leit.forEach(function (l) {
    if (l.Ativa !== 'SIM') return;
    var x = porC[l.ContagemID] = porC[l.ContagemID] || { m: {}, ops: {} };
    x.m[l.Morada] = 1; x.ops[l.Operador] = 1;
  });
  return REPO.ler('Contagens')
    .filter(function (c) { return !apenasAbertas || c.Estado === 'Aberta'; })
    .map(function (c) {
      var x = porC[c.ID] || { m: {}, ops: {} };
      var cor = listaCorredores(c.Corredores);
      var fich = ficheirosDe_(c);
      return { id: c.ID, loja: c.Loja, corredores: cor, ambito: cor.length ? nomeCorredores(cor) : (c.Loja || ''), data: c.Data, estado: c.Estado, criadaPor: c.CriadaPor,
        encerradaEm: c.EncerradaEm, ficheiro: Object.keys(fich).map(function (k) { return k; }).join(', '), ficheiros: fich, ficheiroEm: c.FicheiroCarregadoEm,
        relatorioUrl: c.RelatorioURL, moradas: Object.keys(x.m).length, operadores: Object.keys(x.ops).length };
    })
    .sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : (a.id < b.id ? 1 : -1); });
}

/** Ficheiros do sistema carregados numa contagem: { loja: {nome, em, por, paletes} } */
function ficheirosDe_(c) {
  var v = String(c.FicheiroSistema || '').trim();
  if (!v) return {};
  try { var o = JSON.parse(v); if (o && typeof o === 'object') return o; } catch (e) {}
  var out = {}; out[c.Loja || 'Ficheiro'] = { nome: v, em: c.FicheiroCarregadoEm || '' };
  return out;
}

/** d = {corredores: ['04-SL-90', ...] ou texto, data, por} */
function criarContagem(d) {
  var cor = listaCorredores(d && d.corredores);
  if (!cor.length && !(d && d.loja)) throw new Error('Escolha pelo menos um corredor.');
  return REPO.comLock(function () {
    var data = d.data || REPO.agora().substring(0, 10);
    var sufixo = cor.length ? cor.map(function (c) { var x = partesCorredor(c), p = x.pref.split('-'); return p[p.length - 1] + x.lado; }).join('-') : String(d.loja).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().substring(0, 12);
    var id = 'C' + data.replace(/-/g, '') + '-' + (cor.length ? 'C' : '') + sufixo;
    var existentes = REPO.ler('Contagens').map(function (c) { return c.ID; });
    var n = 1, idFinal = id;
    while (existentes.indexOf(idFinal) >= 0) { n++; idFinal = id + '-' + n; }
    REPO.acrescentar('Contagens', [{ ID: idFinal, Loja: cor.length ? 'Multiloja' : d.loja, Corredores: cor.join(','), Data: data, Estado: 'Aberta', CriadaPor: d.por || '', CriadaEm: REPO.agora() }]);
    return idFinal;
  });
}

function reabrirContagem(id, por) {
  return REPO.comLock(function () {
    var c = obterContagem_(id);
    c.Estado = 'Aberta'; c.EncerradaPor = ''; c.EncerradaEm = '';
    REPO.atualizar('Contagens', c);
    return true;
  });
}

/** Apaga a contagem e todas as suas leituras, referência e resultados. O PDF na Drive não é apagado. */
function eliminarContagem(id, por) {
  return REPO.comLock(function () {
    obterContagem_(id);
    var n = {};
    ['Leituras', 'Referencia', 'Resultados', 'Contagens'].forEach(function (t) {
      var campo = t === 'Contagens' ? 'ID' : 'ContagemID';
      var todas = REPO.ler(t);
      var resto = todas.filter(function (r) { return r[campo] !== id; });
      n[t] = todas.length - resto.length;
      if (n[t]) REPO.reescrever(t, resto);
    });
    return n;
  });
}

/** Leituras ativas em formato compacto, para o PDA validar duplicados localmente */
function obterLeituras(id) {
  var c = obterContagem_(id);
  var mapa = {};
  leiturasAtivas_(id).forEach(function (l) {
    var m = mapa[l.Morada] = mapa[l.Morada] || { morada: l.Morada, estado: l.Estado, operador: l.Operador, dataHora: l.DataHora, sscc: [], lojas: {} };
    if (l.Estado === 'PALETE' && l.SSCC) { m.estado = 'PALETE'; m.sscc.push(l.SSCC); if (l.Loja) m.lojas[l.SSCC] = l.Loja; }
  });
  var cor = listaCorredores(c.Corredores);
  // loja de cada SSCC segundo o sistema (só a loja; a morada não é revelada ao operador)
  var lojaSscc = {};
  referenciaDe_(id).forEach(function (r) { if (r.Loja) lojaSscc[r.SSCC] = r.Loja; });
  return { estado: c.Estado, loja: c.Loja, corredores: cor, ambito: cor.length ? nomeCorredores(cor) : c.Loja,
    espacos: espacosEfetivos_(cor),
    lojaSscc: lojaSscc, moradas: Object.keys(mapa).map(function (k) { return mapa[k]; }) };
}

/**
 * p = {contagemId, morada, vazia, sscc:[], operador, ldap, dataHora, clientId}
 * Substitui qualquer leitura anterior da mesma morada nesta contagem.
 */
function registarMorada(p) {
  if (!p || !p.contagemId || !p.morada) throw new Error('Dados incompletos.');
  var morada = normalizarMorada(p.morada);
  // p.paletes = [{sscc, loja}] (multiloja) ou p.sscc = [...] (versão antiga)
  var paletes = (p.paletes && p.paletes.length ? p.paletes : (p.sscc || []).map(function (s) { return { sscc: s, loja: '' }; }))
    .map(function (x) { return { sscc: normalizarSscc(x.sscc), loja: String(x.loja || '').trim() }; }).filter(function (x) { return x.sscc; });
  var sscc = paletes.map(function (x) { return x.sscc; });
  if (!p.vazia && !sscc.length) throw new Error('Morada sem paletes e não marcada como vazia.');
  return REPO.comLock(function () {
    var c = obterContagem_(p.contagemId);
    var todas = REPO.ler('Leituras');
    if (p.clientId && todas.some(function (r) { return r.ClientID === p.clientId; })) return { ok: true, repetido: true };
    if (c.Estado !== 'Aberta') throw new Error('A contagem ' + c.ID + ' está encerrada. Peça ao Backoffice para reabrir.');

    var avisos = [];
    var anteriores = todas.filter(function (r) { return r.ContagemID === c.ID && r.Ativa === 'SIM'; });
    anteriores.forEach(function (r) {
      if (r.Morada === morada) { r.Ativa = 'NAO'; REPO.atualizar('Leituras', r); }
      else if (r.SSCC && sscc.indexOf(r.SSCC) >= 0) avisos.push('Palete ' + r.SSCC + ' também lida na morada ' + r.Morada + ' (' + r.Operador + ')');
    });
    var agora = REPO.agora();
    var base = { ContagemID: c.ID, Morada: morada, Operador: p.operador || '', LDAP: p.ldap || '', DataHora: p.dataHora || agora, Ativa: 'SIM', ClientID: p.clientId || '', RegistadoEm: agora };
    var novas = p.vazia ? [Object.assign({}, base, { Estado: 'VAZIA', SSCC: '' })]
      : paletes.map(function (x) { return Object.assign({}, base, { Estado: 'PALETE', SSCC: x.sscc, Loja: x.loja }); });
    REPO.acrescentar('Leituras', novas);
    return { ok: true, avisos: avisos };
  });
}

function apagarMorada(id, morada, por) {
  return REPO.comLock(function () {
    var n = 0;
    REPO.ler('Leituras').forEach(function (r) {
      if (r.ContagemID === id && r.Morada === morada && r.Ativa === 'SIM') { r.Ativa = 'NAO'; REPO.atualizar('Leituras', r); n++; }
    });
    return n;
  });
}

function linhasReferencia_(id, linhas, loja, corredores) {
  var fora = 0;
  var novas = (linhas || []).map(function (l) {
    return { ContagemID: id, SSCC: normalizarSscc(l.sscc), Morada: normalizarMorada(l.morada), TipoPalete: l.tipo || '',
      NumArtigos: String(l.numArtigos || ''), QtdTotal: String(l.qtdTotal || ''), Artigos: String(l.artigos || '').substring(0, 2000), Loja: loja || '' };
  }).filter(function (r) {
    if (!r.SSCC || !r.Morada) return false;
    if (!dentroDosCorredores(r.Morada, corredores)) { fora++; return false; }
    return true;
  });
  return { novas: novas, fora: fora };
}
function registarFicheiro_(c, loja, nome, por, paletes) {
  var f = ficheirosDe_(c);
  f[loja || 'Ficheiro'] = { nome: nomeFicheiro_(nome), em: REPO.agora(), por: por || '', paletes: paletes };
  c.FicheiroSistema = JSON.stringify(f);
  c.FicheiroCarregadoEm = REPO.agora() + (por ? ' · ' + por : '');
  REPO.atualizar('Contagens', c);
}
function nomeFicheiro_(n) { return String(n || '').substring(0, 120); }

/** Carrega o ficheiro do sistema de UMA loja. Substitui só as paletes dessa loja nesta contagem.
    linhas = [{sscc, morada, tipo, numArtigos, qtdTotal, artigos}] já agregadas por palete */
function carregarReferencia(id, nomeFicheiro, linhas, por, loja) {
  if (!linhas || !linhas.length) throw new Error('O ficheiro não tem paletes.');
  return REPO.comLock(function () {
    var c = obterContagem_(id);
    var cor = listaCorredores(c.Corredores);
    if (cor.length && !loja) throw new Error('Indique a loja deste ficheiro.');
    var k = chaveLoja_(loja);
    var resto = REPO.ler('Referencia').filter(function (r) { return r.ContagemID !== id || (loja && chaveLoja_(r.Loja) !== k); });
    var x = linhasReferencia_(id, linhas, loja, cor);
    REPO.reescrever('Referencia', resto.concat(x.novas));
    registarFicheiro_(c, loja, nomeFicheiro, por, x.novas.length);
    return { paletes: x.novas.length, foraDoAmbito: x.fora, moradas: Object.keys(x.novas.reduce(function (o, r) { o[r.Morada] = 1; return o; }, {})).length };
  });
}

/** Igual a carregarReferencia, mas em partes (a ligação externa tem limite de tamanho por pedido) */
function carregarReferenciaParte(id, nomeFicheiro, linhas, por, primeira, ultima, loja) {
  return REPO.comLock(function () {
    var c = obterContagem_(id);
    var cor = listaCorredores(c.Corredores);
    var k = chaveLoja_(loja);
    var x = linhasReferencia_(id, linhas, loja, cor);
    if (primeira) REPO.reescrever('Referencia', REPO.ler('Referencia').filter(function (r) { return r.ContagemID !== id || (loja && chaveLoja_(r.Loja) !== k); }).concat(x.novas));
    else REPO.acrescentar('Referencia', x.novas);
    if (ultima) {
      var total = REPO.ler('Referencia').filter(function (r) { return r.ContagemID === id && chaveLoja_(r.Loja) === k; }).length;
      registarFicheiro_(c, loja, nomeFicheiro, por, total);
    }
    return x.novas.length;
  });
}

/** Retira o ficheiro do sistema de uma loja */
function retirarReferencia(id, loja, por) {
  return REPO.comLock(function () {
    var c = obterContagem_(id);
    var k = chaveLoja_(loja);
    REPO.reescrever('Referencia', REPO.ler('Referencia').filter(function (r) { return r.ContagemID !== id || chaveLoja_(r.Loja) !== k; }));
    var f = ficheirosDe_(c);
    Object.keys(f).forEach(function (l) { if (chaveLoja_(l) === k) delete f[l]; });
    c.FicheiroSistema = Object.keys(f).length ? JSON.stringify(f) : '';
    REPO.atualizar('Contagens', c);
    return true;
  });
}

function obterResultado(id) {
  var c = obterContagem_(id);
  var cor = listaCorredores(c.Corredores);
  var arm = obterArmazem('', cor);
  var r = calcularResultado(leiturasAtivas_(id), referenciaDe_(id), espacosEfetivos_(cor), arm.tipos);
  r.armazem = arm;
  aplicarLimites_(r);
  var espRacks = arm.moradas.length || arm.racks.reduce(function (s, x) { return s + (x.espacos || 0); }, 0);
  if (espRacks) {
    r.espacos.espacosRacks = espRacks;
    r.espacos.ocupacaoEspacos = Math.round(r.espacos.espacosOcupados / espRacks * 1000) / 10;
    r.espacos.ocupacaoEspacosSistema = r.temReferencia ? Math.round(r.espacos.espacosSistema / espRacks * 1000) / 10 : null;
  }
  var fich = ficheirosDe_(c);
  r.contagem = { id: c.ID, loja: c.Loja, corredores: cor, ambito: cor.length ? nomeCorredores(cor) : c.Loja, ficheiros: fich,
    lojas: obterConfigPublica().lojas, data: c.Data, estado: c.Estado,
    ficheiro: Object.keys(fich).map(function (l) { return l + ': ' + fich[l].nome; }).join(' · '), ficheiroEm: c.FicheiroCarregadoEm,
    encerradaEm: c.EncerradaEm, encerradaPor: c.EncerradaPor, relatorioUrl: c.RelatorioURL };
  return r;
}

/** Mapa do armazém sem abrir auditoria: para cada corredor, usa a última auditoria que lhe tocou
    (leituras e ficheiro do sistema dessa auditoria). Corredores sem auditoria aparecem só com as racks. */
/* ---------- limite de ocupação por loja ---------- */
function limitesLojas_() {
  var out = {};
  try { REPO.ler('Lojas').forEach(function (r) { var n = parseInt(r.LimiteEspacos, 10); if (r.Loja && n > 0) out[r.Loja] = n; }); } catch (e) {}
  return out;
}
/** Limites por loja: { loja: espaços } */
function obterLimitesLojas() { return limitesLojas_(); }
function guardarLimitesLojas(mapa, por) {
  var linhas = Object.keys(mapa || {}).map(function (l) { return { Loja: l, LimiteEspacos: String(Math.max(0, parseInt(mapa[l], 10) || 0) || '') }; })
    .filter(function (r) { return r.Loja; });
  return REPO.comLock(function () {
    try { REPO.reescrever('Lojas', linhas); } catch (e) { throw new Error('Falta a aba Lojas. Execute a função instalar() no editor.'); }
    return linhas.length;
  });
}
/** Junta o limite a cada linha do resumo por loja */
function aplicarLimites_(r) {
  var lim = limitesLojas_();
  r.limites = lim;
  (r.porLoja || []).forEach(function (o) {
    var k = Object.keys(lim).filter(function (l) { return chaveLoja_(l) === chaveLoja_(o.loja); })[0];
    o.limite = k ? lim[k] : null;
    o.usoLimite = o.limite ? Math.round(o.espacosLidos / o.limite * 1000) / 10 : null;
    o.usoLimiteSistema = o.limite ? Math.round(o.espacosSistema / o.limite * 1000) / 10 : null;
  });
  // lojas com limite mas sem paletes também aparecem
  Object.keys(lim).forEach(function (l) {
    if (!(r.porLoja || []).some(function (o) { return chaveLoja_(o.loja) === chaveLoja_(l); })) {
      (r.porLoja = r.porLoja || []).push({ loja: l, sistema: 0, lidas: 0, ok: 0, foraSitio: 0, emFalta: 0, semRegisto: 0, duplicadas: 0, naoConferidas: 0, lojaDiferente: 0, espacosLidos: 0, espacosSistema: 0, limite: lim[l], usoLimite: 0, usoLimiteSistema: 0 });
    }
  });
  return r;
}

function obterMapaArmazem() {
  var cfg = lerConfig_();
  var segC = (parseInt(String(cfg.MAPA_SEGMENTOS || '3,4,5').split(',')[0], 10) || 3) - 1;
  function corDe(m) { var p = String(m || '').split('-'); return p.length > segC ? p.slice(0, segC + 1).join('-') : ''; }
  function chaveDe(m) { var c = corDe(m); return c ? c + ':' + (ladoDaMorada(m, c) || 'P') : ''; }
  var cmap = {};
  REPO.ler('Contagens').forEach(function (c) { cmap[c.ID] = c; });
  var leit = REPO.ler('Leituras').filter(function (l) { return l.Ativa === 'SIM'; });
  var ref = REPO.ler('Referencia');
  var porCor = {};
  function considerar(cid, m) {
    var cor = chaveDe(m), c = cmap[cid];
    if (!cor || !c) return;
    var k = (c.Data || '') + '|' + (c.CriadaEm || '') + '|' + c.ID;
    if (!porCor[cor] || porCor[cor].k < k) porCor[cor] = { k: k, id: cid };
  }
  leit.forEach(function (l) { considerar(l.ContagemID, l.Morada); });
  ref.forEach(function (r) { considerar(r.ContagemID, r.Morada); });
  var daUltima = function (cid, m) { var x = porCor[chaveDe(m)]; return x && x.id === cid; };
  var L = leit.filter(function (l) { return daUltima(l.ContagemID, l.Morada); });
  var Rf = ref.filter(function (r) { return daUltima(r.ContagemID, r.Morada); });
  var arm = obterArmazem('', null);
  var r = calcularResultado(L, Rf, espacosEfetivos_(null), arm.tipos);
  r.armazem = arm;
  var mapa = {};
  L.forEach(function (l) {
    var m = mapa[l.Morada] = mapa[l.Morada] || { morada: l.Morada, estado: l.Estado, operador: l.Operador, dataHora: l.DataHora, sscc: [], lojas: {} };
    if (l.Estado === 'PALETE' && l.SSCC) { m.estado = 'PALETE'; m.sscc.push(l.SSCC); if (l.Loja) m.lojas[l.SSCC] = l.Loja; }
  });
  r.leituras = { moradas: Object.keys(mapa).map(function (k) { return mapa[k]; }) };
  var todos = {};
  Object.keys(porCor).forEach(function (k) { todos[k.split(':')[0]] = 1; });
  arm.racks.forEach(function (x) { todos[x.corredor] = 1; });
  var info = function (cor, lado, x) {
    var c = x ? cmap[x.id] : null, cc = c ? listaCorredores(c.Corredores) : [];
    return { corredor: cor, lado: lado, contagemId: c ? c.ID : '', data: c ? c.Data : '', estado: c ? c.Estado : '', ambito: c ? (cc.length ? nomeCorredores(cc) : c.Loja) : '' };
  };
  r.corredoresInfo = [];
  Object.keys(todos).sort(compararMoradas).forEach(function (cor) {
    var p = porCor[cor + ':P'], i = porCor[cor + ':I'];
    if (p && i && p.id !== i.id) { r.corredoresInfo.push(info(cor, 'P', p)); r.corredoresInfo.push(info(cor, 'I', i)); }
    else r.corredoresInfo.push(info(cor, '', p || i));
  });
  r.contagem = { id: '', ambito: 'Armazém', corredores: [], ficheiros: {}, lojas: obterConfigPublica().lojas, estado: '', data: REPO.agora().substring(0, 10) };
  aplicarLimites_(r);
  return r;
}

/** Encerra a contagem, guarda o resultado e gera o relatório PDF */
function encerrarContagem(id, por) {
  var r = REPO.comLock(function () {
    var c = obterContagem_(id);
    c.Estado = 'Encerrada'; c.EncerradaPor = por || ''; c.EncerradaEm = REPO.agora();
    REPO.atualizar('Contagens', c);
    var res = obterResultado(id);
    var agora = REPO.agora();
    var resto = REPO.ler('Resultados').filter(function (x) { return x.ContagemID !== id; });
    REPO.reescrever('Resultados', resto.concat(res.linhas.map(function (l) {
      return { ContagemID: id, Resultado: RESULTADOS[l.resultado].nome, SSCC: l.sscc, MoradaSistema: l.moradaSistema, MoradaLida: l.moradaLida,
        Operador: l.operador, DataHora: l.dataHora, TipoPalete: l.tipoPalete, Artigos: l.artigos, GeradoEm: agora, Loja: l.loja, LojaLida: l.lojaLida };
    })));
    return res;
  });
  return gerarRelatorio(id);
}

function gerarRelatorio(id) {
  var res = obterResultado(id);
  var html = relatorioHtml(res, lerConfig_());
  var nome = 'Auditoria_' + String(res.contagem.ambito || res.contagem.loja).replace(/\s+/g, '_') + '_' + res.contagem.data + '.pdf';
  var url = REPO.guardarPdf ? REPO.guardarPdf(html, nome, lerConfig_()) : '';
  if (url) {
    REPO.comLock(function () { var c = obterContagem_(id); c.RelatorioURL = url; REPO.atualizar('Contagens', c); });
  }
  return { html: html, url: url, nome: nome };
}

    acrescentar: function (t, objs) { DEMO_MEM[t] = (DEMO_MEM[t] || []).concat(objs.map(function (o) { var c = Object.assign({}, o); delete c._linha; return c; })); demoGuardar_(); },

/* Ligação por JSONP: o pedido leva a sessão Google do Chrome (conta da empresa),
   por isso funciona com a implementação em "Qualquer pessoa na organização". */
var JSONP_N = 0;
function pedidoJsonp_(payload) {
  return new Promise(function (res, rej) {
    var cb = 'cmcb' + Date.now().toString(36) + (JSONP_N++);
    var s = document.createElement('script');
    var feito = false;
    function fim() { feito = true; clearTimeout(tm); window[cb] = function () {}; if (s.parentNode) s.parentNode.removeChild(s); }
    function erroRede(txt) { var er = new Error(txt); er.rede = true; return er; }
    var tm = setTimeout(function () {
      if (feito) return; fim();
      rej(erroRede('Sem resposta do servidor. Confirme que o Chrome tem sessão iniciada com a conta da empresa e que a implementação está na versão mais recente.'));
    }, 30000);
    window[cb] = function (j) {
      if (feito) return; fim();
      if (j && j.ok) res(j.r); else { var er = new Error((j && j.erro) || 'Erro no servidor'); er.servidor = true; rej(er); }
    };
    s.onerror = function () {
      if (feito) return; fim();
      rej(erroRede('Sem ligação ao servidor. Verifique a rede e se o Chrome tem sessão iniciada com a conta da empresa (abra o URL /exec uma vez e inicie sessão).'));
    };
    s.src = LIGACAO.api + (LIGACAO.api.indexOf('?') >= 0 ? '&' : '?') + 'cb=' + cb + '&q=' + encodeURIComponent(JSON.stringify(payload));
    document.head.appendChild(s);
  });
}
/** Envia o ficheiro do sistema em partes pequenas (limite de tamanho do pedido) */
function carregarReferenciaPartes_(args) {
  var id = args[0], nome = args[1], linhas = args[2], por = args[3], loja = args[4] || '';
  var partes = [], atual = [], tam = 0, LIMITE = 4500;
  linhas.forEach(function (l) {
    var x = { sscc: l.sscc, morada: l.morada, tipo: l.tipo, numArtigos: l.numArtigos, qtdTotal: l.qtdTotal, artigos: String(l.artigos || '').substring(0, 180) };
    var n = encodeURIComponent(JSON.stringify(x)).length;
    if (atual.length && tam + n > LIMITE) { partes.push(atual); atual = []; tam = 0; }
    atual.push(x); tam += n;
  });
  if (atual.length) partes.push(atual);
  var total = 0, i = 0;
  function seguinte() {
    if (i >= partes.length) return Promise.resolve({ paletes: total });
    var k = i++;
    var m = document.querySelector('.veu .modal div');
    if (m) m.textContent = 'A enviar parte ' + (k + 1) + ' de ' + partes.length + '…';
    return pedidoJsonp_({ fn: 'carregarReferenciaParte', args: [id, nome, partes[k], por, k === 0, k === partes.length - 1, loja], chave: LIGACAO.chave, pin: PIN_SESSAO })
      .then(function (n) { total += n; return seguinte(); });
  }
  return seguinte();
}

function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    if (EM_APPS_SCRIPT) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e && e.message ? e : new Error(String(e))); });
      r[fn].apply(r, args);
    } else if (!MODO_DEMO) {
      if (fn === 'carregarReferencia') return carregarReferenciaPartes_(args).then(res, rej);
      pedidoJsonp_({ fn: fn, args: args, chave: LIGACAO.chave, pin: PIN_SESSAO }).then(res, rej);
    } else {
      setTimeout(function () {
        try { res(JSON.parse(JSON.stringify(window[fn].apply(null, JSON.parse(JSON.stringify(args))) || null))); }
        catch (e) { rej(e); }
      }, 150);
    }
  });
}

function abrirLeitura(c) {

var LEITOR = { win: null, silencio: false };
function urlLeitorCam() {
  if (!EM_APPS_SCRIPT) return 'leitor.html';
  return String(CFG.leitorUrl == null ? 'https://ruifbastos.github.io/ConfereSL/leitor.html' : CFG.leitorUrl).trim();
}
function temLeitorCam() { return !!urlLeitorCam(); }
function abrirLeitorCam() {
  if (LEITOR.win && !LEITOR.win.closed) { try { LEITOR.win.focus(); } catch (e) {} return; }
  LEITOR.win = window.open(urlLeitorCam(), 'gsl_leitor');
  if (!LEITOR.win) { bip('err'); mensagem('err', 'O browser bloqueou o leitor da câmara. Autorize pop-ups para este site e toque outra vez na câmara.'); }
}
function textoModal(reg) {
  var c = reg.el.querySelector('.modal').cloneNode(true);
  Array.prototype.forEach.call(c.querySelectorAll('h2,.botoes'), function (x) { x.remove(); });
  Array.prototype.forEach.call(c.querySelectorAll('div,p,li,br'), function (x) { x.insertAdjacentText('afterend', ' '); });
  return c.textContent.replace(/\s+/g, ' ').trim();
}
function estadoLeitorCam() {
  var r = { titulo: (CFG.nomeApp || 'GSL') + ' · ' + (S.cont ? (S.cont.ambito || S.cont.loja || '') : ''), sub: S.op ? S.op.nome : '' };
  if (S.ecra !== 'leitura' || !S.cont) { r.semAuditoria = true; return r; }
  var a = S.atual;
  r.morada = a ? a.morada : '';
  r.paletes = a ? a.sscc.length : 0;
  r.feitas = (S.ultimas || []).length;
  r.encerrada = !!S.contEncerrada;
  if (S.pendente) r.pendente = { sscc: fmtSscc(S.pendente.sscc), sugerida: S.pendente.sugerida || '', lojas: CFG.lojas || [] };
  r.podeVazia = !!a && !a.sscc.length && !S.pendente;
  r.podeConcluir = !!a && a.sscc.length > 0 && !S.pendente;
  r.podeAnular = !!S.pendente || (!!a && a.sscc.length > 0);
  r.podeCancelar = !!a;
  var top = MODAIS[MODAIS.length - 1];
  if (top) r.modal = { titulo: top.o.titulo || '', texto: textoModal(top), botoes: (top.o.botoes || [{ t: 'OK' }]).map(function (b) { return b.t; }) };
  return r;
}
function responderLeitorCam(dest, id, msgAntes, modalAntes) {
  var r = estadoLeitorCam();
  r.gsl = 'resposta'; r.id = id;
  if (S.msg && S.msg !== msgAntes) { r.k = S.msg.c === 'err' ? 'bad' : S.msg.c === 'av' ? 'warn' : 'ok'; r.t = S.msg.t; r.novo = true; }
  else if (S.msg) { r.k = ''; r.t = S.msg.t; }
  if (r.modal && MODAIS[MODAIS.length - 1] !== modalAntes) { r.novo = true; r.k = 'warn'; r.t = r.modal.titulo; }
  try { dest.postMessage(r, '*'); } catch (e) {}
}
window.addEventListener('message', function (ev) {
  var d = ev.data;
  if (!d || typeof d !== 'object' || !d.gsl || d.gsl === 'resposta') return;
  if (LEITOR.win && !LEITOR.win.closed && ev.source !== LEITOR.win) return;
  LEITOR.win = ev.source;
  var antes = S.msg, modalAntes = MODAIS[MODAIS.length - 1];
  if (S.ecra === 'leitura' && S.cont) {
    LEITOR.silencio = true;
    try {
      if (d.gsl === 'codigo') {
        var cl = classificarCodigo(d.c, CFG.regexMorada);
        if (cl.tipo === 'invalido') { try { ev.source.postMessage({ gsl: 'resposta', id: d.id, ignorado: true, t: 'Código ignorado: ' + cl.valor }, '*'); } catch (e) {} return; }
        lerCodigo(d.c);
      } else if (d.gsl === 'acao' && !modalAberto) {
        if (d.a === 'vazia') concluirMorada(true);
        else if (d.a === 'concluir') concluirMorada(false);
        else if (d.a === 'loja') escolherLoja(d.loja);
        else if (d.a === 'anular') $('#btAnular').click();
        else if (d.a === 'cancelar' && S.atual) { S.atual = null; S.pendente = null; guardarAtual(); mensagem('info', 'Morada cancelada. Leia a etiqueta da morada.'); pintarLeitura(); }
      } else if (d.gsl === 'acao' && d.a === 'modal') {
        var top = MODAIS[MODAIS.length - 1];
        var bts = top ? top.el.querySelectorAll('.botoes button') : [];
        if (bts[d.i]) bts[d.i].click();
      }
    } finally { LEITOR.silencio = false; }
  }
  var src = ev.source, id = d.id;
  setTimeout(function () { responderLeitorCam(src, id, antes, modalAntes); }, 60);
});

/* ---------- loja de cada palete (armazém multiloja) ---------- */
function pedirLoja(sscc) {
  var lojas = CFG.lojas || [];
  if (lojas.length <= 1) { juntarPalete(sscc, lojas[0] || ''); return; }
  S.pendente = { sscc: sscc, sugerida: S.lojaSscc[sscc] || '' };
  bip('ok');
  mensagem('info', 'Palete ' + fmtSscc(sscc) + ' lida. Toque na loja indicada na etiqueta.');
  pintarLeitura();
}
function pintarEscolhaLoja() {
  var el = $('#escolhaLoja'); if (!el) return;
  var p = S.pendente;
  if (!p) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = '<div class="cartao escolha-loja"><h3>Loja da palete <span class="cod">' + fmtSscc(p.sscc) + '</span></h3>' +
    (p.sugerida ? '<div class="pequeno muted">Segundo o sistema: <b>' + h(p.sugerida) + '</b>. Confirme na etiqueta.</div>' : '<div class="pequeno muted">Palete sem loja no sistema. Escolha a loja da etiqueta.</div>') +
    '<div class="grelha-lojas">' + (CFG.lojas || []).map(function (l) {
      return '<button type="button" class="btn ' + (chaveLoja_(l) === chaveLoja_(p.sugerida) ? 'prim' : 'sec') + '" data-loja="' + h(l) + '">' + h(l) + '</button>';
    }).join('') + '</div></div>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-loja]'), function (b) { b.onclick = function () { escolherLoja(b.dataset.loja); }; });
}
function escolherLoja(loja) {
  var p = S.pendente; if (!p) return;
  if (p.sugerida && chaveLoja_(p.sugerida) !== chaveLoja_(loja)) {
    bip('err');
    modal({ titulo: 'Loja diferente do sistema', classe: 'aviso',
      html: '<div>Escolheu <b>' + h(loja) + '</b>, mas o sistema indica que a palete <span class="cod">' + fmtSscc(p.sscc) + '</span> é de <b>' + h(p.sugerida) + '</b>.</div><div class="muted pequeno">Confirme a loja na etiqueta da palete.</div>',
      botoes: [{ t: 'Corrigir para ' + p.sugerida, c: 'prim', f: function () { S.pendente = null; juntarPalete(p.sscc, p.sugerida); } },
               { t: 'A etiqueta diz ' + loja, c: 'amb', f: function () { S.pendente = null; juntarPalete(p.sscc, loja); } }] });
    return;
  }
  S.pendente = null;
  juntarPalete(p.sscc, loja);
}

function abrirMorada(m, reconf) {
  S.atual = { morada: m, sscc: [], lojas: {}, reconferir: !!reconf, inicio: agoraLocal() };
  guardarAtual(); bip('ok');
  mensagem('ok', 'Morada ' + m + '. Leia as paletes ou carregue VAZIA.');
  pintarLeitura();
}
function juntarPalete(s, loja) {
  S.atual.sscc.push(s); S.atual.lojas = S.atual.lojas || {}; if (loja) S.atual.lojas[s] = loja; guardarAtual(); bip('ok');
  mensagem('ok', 'Palete ' + S.atual.sscc.length + ' registada' + (loja ? ' · ' + loja : '') + ': ' + fmtSscc(s) + '. Leia a próxima palete ou carregue CONCLUIR.');
  pintarLeitura();
}
function concluirMorada(vazia, silencioso) {
  var a = S.atual; if (!a) return;
  if (S.pendente) { bip('err'); mensagem('err', 'Escolha primeiro a loja da palete ' + fmtSscc(S.pendente.sscc) + '.'); return; }
  if (vazia && a.sscc.length) return;
  if (!vazia && !a.sscc.length) return;
  var item = { contagemId: S.cont.id, morada: a.morada, vazia: !!vazia, sscc: vazia ? [] : a.sscc.slice(),
    paletes: vazia ? [] : a.sscc.map(function (s) { return { sscc: s, loja: (a.lojas && a.lojas[s]) || '' }; }), operador: S.op.nome, ldap: S.op.ldap, dataHora: agoraLocal(), clientId: uid() };
  S.fila.push(item); ls('fila', S.fila);
  S.ultimas.unshift({ clientId: item.clientId, morada: item.morada, vazia: item.vazia, n: item.sscc.length, dataHora: item.dataHora });
  S.ultimas = S.ultimas.slice(0, 30); ls('ultimas_' + S.cont.id, S.ultimas);
  S.cache[item.morada] = { morada: item.morada, estado: vazia ? 'VAZIA' : 'PALETE', operador: item.operador, dataHora: item.dataHora, sscc: item.sscc.slice() };
  S.atual = null; guardarAtual();
  if (!silencioso) { bip('fim'); mensagem('ok', 'Morada ' + item.morada + (vazia ? ' registada como vazia.' : ' concluída com ' + item.sscc.length + (item.sscc.length === 1 ? ' palete.' : ' paletes.')) + ' Leia a próxima morada.'); }
  pintarLeitura();
  enviarFila();
}

/* ---------- fila de envio (resiste a falhas de rede) ---------- */
function enviarFila() {
  if (S.aEnviar) return;
  var it = S.fila.filter(function (f) { return !f.erro; })[0];
  if (!it) { pintarSync(); return; }
  S.aEnviar = true; pintarSync();
  api('registarMorada', it).then(function (r) {
    S.aEnviar = false;
    S.fila = S.fila.filter(function (f) { return f.clientId !== it.clientId; }); ls('fila', S.fila);
    if (r && r.avisos && r.avisos.length && S.ecra === 'leitura') { bip('err'); mensagem('av', r.avisos.join(' · ')); }
    pintarUltimas(); pintarSync();
    enviarFila();
  }).catch(function (e) {
    S.aEnviar = false;
    var msg = (e && e.message) || String(e);
    if (!e.rede && /encerrada|não encontrada|incompletos|chave/i.test(msg)) {
      it.erro = msg; ls('fila', S.fila);
      if (S.ecra === 'leitura') { bip('err'); mensagem('err', 'Morada ' + it.morada + ' não foi guardada: ' + msg); }
      if (/encerrada/i.test(msg)) S.contEncerrada = true;
      pintarLeitura();
      enviarFila();
    } else {
      pintarSync();
      setTimeout(enviarFila, 8000);
    }
  });
}

          '<td>' + h(L.lado) + '</td><td class="num">' + L.min + '–' + L.max + ' <span class="muted pequeno">(' + L.colunas + ')</span></td><td class="cod pequeno">' + L.niveis.map(h).join(', ') + '</td><td class="num">' + L.moradas + '</td>' +

    '</tbody></table></div>' +
    '<div class="campo"><label for="txtMoradas">Colar lista de moradas</label><textarea id="txtMoradas" rows="5" class="cod" style="width:100%;border:2px solid var(--linha);border-radius:8px;padding:10px;font-size:13px" placeholder="Cole aqui (pode ser a tabela inteira copiada do sistema: só as moradas são aproveitadas). Pode colar várias vezes seguidas: copie um pedaço, cole, desça na lista do sistema, copie o pedaço seguinte e cole por baixo. Para apagar moradas, escreva-as aqui (uma por linha) e escolha Apagar."></textarea><div id="contMor" class="pequeno muted">0 moradas no texto</div></div>' +

function extrairMoradas(texto) {

  var v = {}; return m.filter(function (x) { return v[x] ? false : (v[x] = 1); });
}
function importarMoradasUI(lista, origem) {

  }

    if (/\.(csv|txt)$/i.test(file.name)) { file.text().then(function (tx) { importarMoradasUI(extrairMoradas(tx), file.name); }); return; }
    carregarXlsxLib().then(function () { return file.arrayBuffer(); }).then(function (buf) {
      var wb = XLSX.read(buf, { type: 'array', raw: false, cellText: true });
      var tx = wb.SheetNames.map(function (n) { return XLSX.utils.sheet_to_csv(wb.Sheets[n]); }).join('\n');
      importarMoradasUI(extrairMoradas(tx), file.name);
    }).catch(function (e) { $('#morMsg').innerHTML = '<div class="msg err">' + h(e.message) + '</div>'; });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-apagar-cor]'), function (b) {

}

  var cls = { OK: 'ok', OK_VAZIA: 'cinza', FORA_SITIO: 'err', EM_FALTA: 'err', SEM_REGISTO: 'err', DUPLICADA: 'err', NAO_CONFERIDA: 'pend' };
  el.innerHTML = '<table class="t"><thead><tr><th>Resultado</th><th>Loja</th><th>SSCC</th><th>Morada sistema</th><th>Morada encontrada</th><th>Conteúdo</th><th>Operador</th><th>Hora</th></tr></thead><tbody>' +
    linhas.map(function (l) {

        '<td>' + h(l.loja || '—') + (l.lojaDiferente ? '<div class="pequeno" style="color:#7a5300">lida: ' + h(l.lojaLida) + '</div>' : '') + '</td><td class="cod pequeno">' + h(l.sscc || '—') + '</td>' +
        '<td class="cod">' + h(l.moradaSistema || '—') + '</td><td class="cod">' + (l.moradaLida && l.moradaLida !== l.moradaSistema && l.moradaSistema ? '<b style="color:var(--erro)">' + h(l.moradaLida) + '</b>' : h(l.moradaLida || '—')) + '</td>' +
        '<td class="art">' + h((l.tipoPalete ? l.tipoPalete + ' · ' : '') + (l.artigos || '')) + '</td><td>' + h(l.operador || '—') + '</td><td class="num">' + hora(l.dataHora) + '</td></tr>';

/* ---------- mapa do armazém ---------- */
var ESTADOS_MAPA = {
  ok:    { nome: 'Ocupada · correta', ordem: 2 },
  vazia: { nome: 'Vazia · confirmada', ordem: 1 },
  div:   { nome: 'Com divergência', ordem: 4 },
  pend:  { nome: 'Ocupada no sistema · por conferir', ordem: 3 },
  livre: { nome: 'Livre · sem leitura', ordem: 0 },
  inex:  { nome: 'Passagem / sem posição', ordem: -1 }
};
var CORES_TIPO = { 1: '', 2: '#1F5FA8', 3: '#6A2C91', 4: '#3B1260' };

/** Estado de cada morada conhecida (lida e/ou no ficheiro do sistema) */
function estadosMoradas(r, leit) {
  var M = {};
  var tipos = (r.armazem && r.armazem.tipos) || [];
  var refTipo = {};
  r.linhas.forEach(function (l) { if (l.sscc && l.tipoPalete) refTipo[l.sscc] = l.tipoPalete; });
  (leit.moradas || []).forEach(function (m) {
    M[m.morada] = { morada: m.morada, lida: true, vazia: m.estado === 'VAZIA', sscc: m.sscc || [], operador: m.operador, dataHora: m.dataHora, linhas: [] };
  });
  r.linhas.forEach(function (l) {
    [l.moradaSistema, l.moradaLida].forEach(function (mm) {
      if (!mm) return;
      var o = M[mm] = M[mm] || { morada: mm, lida: false, vazia: false, sscc: [], linhas: [] };
      if (o.linhas.indexOf(l) < 0) o.linhas.push(l);
    });
  });
  Object.keys(M).forEach(function (k) {
    var o = M[k];
    var div = o.linhas.some(function (l) { return RESULTADOS[l.resultado].div && (l.moradaLida === k || (l.moradaSistema === k && o.lida)); });
    o.estado = !o.lida ? 'pend' : div ? 'div' : o.vazia ? 'vazia' : 'ok';
    // tipo de palete: do que foi lido (pelo SSCC), senão do sistema
    var ssccs = o.lida ? o.sscc : o.linhas.filter(function (l) { return l.moradaSistema === k && l.sscc; }).map(function (l) { return l.sscc; });
    o.paletes = o.estado === 'vazia' ? [] : ssccs.map(function (s) { return { sscc: s, tipo: tipoPalete(refTipo[s] || '', tipos) }; });
    if (o.estado !== 'vazia' && !o.paletes.length) o.paletes.push({ sscc: '', tipo: tipoPalete('', tipos) });
    o.espacos = o.paletes.reduce(function (s, p) { return s + p.tipo.espacos; }, 0);
    o.tipo = o.paletes.length === 1 ? o.paletes[0].tipo : null;
  });
  return M;
}
function segmentosMapa() {
  var p = String(CFG.mapaSegmentos || '3,4,5').split(',').map(function (x) { return parseInt(x, 10) - 1; });
  return { c: p[0] >= 0 ? p[0] : 2, p: p[1] >= 0 ? p[1] : 3, n: p[2] >= 0 ? p[2] : 4 };
}

/** Agrupa as moradas por corredor e lado, juntando as racks configuradas (mesmo sem moradas) */
function montarCorredores(M) {
  var sg = segmentosMapa(), grupos = {}, outras = [];
  var racks = (S.res.armazem && S.res.armazem.racks) || [];
  function grupo(chave, corredor) {
    return grupos[chave] = grupos[chave] || { chave: chave, corredor: corredor, faces: {} };
  }
  function face(G, par) {
    var k = par ? 'Par' : 'Ímpar';
    return G.faces[k] = G.faces[k] || { lado: k, celulas: {}, pos: {}, niv: {}, rack: null };
  }
  racks.forEach(function (r) {
    var parts = r.corredor.split('-');
    var G = grupo(r.corredor, parts[parts.length - 1]);
    var F = face(G, r.lado === 'Par');
    F.rack = r;
  });
  // lista real de moradas do sistema: define que posições existem
  ((S.res.armazem && S.res.armazem.moradas) || []).forEach(function (m) {
    var parts = m.split('-');
    var pos = parts[sg.p], niv = parts[sg.n];
    if (parts.length <= Math.max(sg.c, sg.p, sg.n) || !/^\d+$/.test(pos) || !/^\d+$/.test(niv)) return;
    var G = grupo(parts.slice(0, sg.c + 1).join('-'), parts[sg.c]);
    var F = face(G, +pos % 2 === 0);
    F.lista = true;
    F.existe = F.existe || {}; F.posL = F.posL || {}; F.nivL = F.nivL || {};
    F.existe[(+pos) + '|' + (+niv)] = 1; F.posL[+pos] = 1; F.nivL[+niv] = niv;
  });
  Object.keys(M).forEach(function (m) {
    var parts = m.split('-');
    var pos = parts[sg.p], niv = parts[sg.n];
    if (parts.length <= Math.max(sg.c, sg.p, sg.n) || !/^\d+$/.test(pos) || !/^\d+$/.test(niv)) { outras.push(M[m]); return; }
    var G = grupo(parts.slice(0, sg.c + 1).join('-'), parts[sg.c]);
    var F = face(G, +pos % 2 === 0);
    var k = (+pos) + '|' + (+niv);
    (F.celulas[k] = F.celulas[k] || []).push(M[m]);
    F.pos[+pos] = 1; F.niv[+niv] = niv;
  });
  return { grupos: grupos, outras: outras };
}
