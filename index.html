/** Desenha um lado de um corredor como uma rack vista de frente.
    Um quadrado = uma morada. Os vãos (3 ou 4 moradas entre montantes) ficam separados.
    Uma palete de vários espaços ocupa a sua morada e as seguintes à direita, dentro do vão. */
function desenharFace(G, F, filtro, resumo) {
  var rack = F.rack;
  var cols = [], niveis = [], sem = {};
  if (rack) {
    var a = parseInt(rack.colunaInicial, 10), b = parseInt(rack.colunaFinal, 10);
    for (var c = Math.min(a, b); c <= Math.max(a, b); c += 2) cols.push(c);
    niveis = String(rack.niveis || '').split(',').map(function (n) { return n.trim(); }).filter(String);
    sem = posicoesInexistentes(rack.semPosicao, 2);
  }
  var extra = Object.keys(F.pos).map(Number).filter(function (p) { return cols.indexOf(p) < 0; });
  Object.keys(F.niv).forEach(function (n) { if (!niveis.some(function (x) { return +x === +n; })) niveis.push(F.niv[n]); });
  if (!rack) {
    cols = Object.keys(F.pos).map(Number).sort(function (x, y) { return x - y; });
    if (cols.length > 1) {
      var cheio = [];
      for (var x = cols[0]; x <= cols[cols.length - 1]; x += 2) cheio.push(x);
      if (cheio.length <= 400) cols = cheio;
    }
    extra = [];
  }
  if (F.lista) { // a lista de moradas do sistema manda: colunas, níveis e posições que existem
    cols = Object.keys(F.posL).map(Number);
    Object.keys(F.pos).map(Number).forEach(function (p) { if (cols.indexOf(p) < 0) cols.push(p); });
    cols.sort(function (x, y) { return x - y; });
    niveis = Object.keys(F.nivL).map(function (k) { return F.nivL[k]; });
    Object.keys(F.niv).forEach(function (n) { if (!niveis.some(function (x) { return +x === +n; })) niveis.push(F.niv[n]); });
    sem = {};
    cols.forEach(function (c) { niveis.forEach(function (nv) { if (!F.existe[c + '|' + (+nv)]) sem[c + '|' + (+nv)] = 1; }); });
    extra = [];
  }
  niveis.sort(function (x, y) { return +y - +x; });

  // vãos: com rack configurada usa a composição; sem rack, um só bloco
  var vaos;
  if (rack && F.lista) {
    // vãos definidos pela rack (da 1.ª à última coluna configurada); as colunas da lista encaixam neles
    var rc = [], ra = parseInt(rack.colunaInicial, 10), rb = parseInt(rack.colunaFinal, 10);
    if (!isNaN(ra) && !isNaN(rb)) for (var q = Math.min(ra, rb); q <= Math.max(ra, rb); q += 2) rc.push(q);
    var usadas = {};
    vaos = vaosDaRack(rack, rc).map(function (v) { return v.filter(function (c) { if (cols.indexOf(c) >= 0) { usadas[c] = 1; return true; } return false; }); })
      .filter(function (v) { return v.length; });
    cols.filter(function (c) { return !usadas[c]; }).forEach(function (c) { vaos.push([c]); });
    vaos.sort(function (x, y) { return x[0] - y[0]; });
  } else vaos = rack ? vaosDaRack(rack, cols) : [cols];
  extra.sort(function (x, y) { return x - y; }).forEach(function (p) { vaos.push([p]); }); // moradas fora da rack, à parte
  // colunas da grelha: 1 = níveis; montante (6px) entre vãos
  var gridCols = ['34px'], gcol = {}, vaoDe = {}, n = 2;
  vaos.forEach(function (v, vi) {
    if (vi > 0) { gridCols.push('6px'); n++; }
    v.forEach(function (c, pi) { gcol[c] = n++; gridCols.push('minmax(24px, 1fr)'); vaoDe[c] = { v: v, i: pi }; });
  });
  var totalCols = cols.length + extra.length;

  var html = '<div class="face-tit">Colunas ' + (F.lado === 'Par' ? 'pares' : 'ímpares') + (F.lista ? ' <span class="muted">· moradas do sistema' + (rack ? '' : ' · vãos não configurados') + '</span>' : rack ? '' : ' <span class="muted">(rack não configurada)</span>') + '</div>';
  html += '<div class="rack-scroll"><div class="rack2" style="grid-template-columns:' + gridCols.join(' ') + ';grid-template-rows:20px repeat(' + niveis.length + ', 30px);min-width:' + (38 + totalCols * 26 + vaos.length * 8) + 'px;max-width:' + (38 + totalCols * 48 + vaos.length * 8) + 'px">';
  html += '<div class="canto"></div>';
  vaos.forEach(function (v) { v.forEach(function (c) { html += '<div class="cab-col" style="grid-column:' + gcol[c] + ';grid-row:1">' + c + '</div>'; }); });
  // montantes
  for (var g = 2, vi2 = 0; vi2 < vaos.length; vi2++) {
    if (vi2 > 0) { html += '<div class="montante" style="grid-column:' + g + ';grid-row:1 / span ' + (niveis.length + 1) + '"></div>'; g++; }
    g += vaos[vi2].length;
  }

  niveis.forEach(function (nv, ri) {
    var row = ri + 2;
    html += '<div class="lv2" style="grid-row:' + row + '">' + h(nv) + '</div>';
    var temPalete = function (c) { var l = F.celulas[c + '|' + (+nv)]; return l && l.some(function (o) { return o.estado !== 'vazia'; }); };
    var coberto = {}; // coluna -> bloco que a ocupa
    var blocos = [];
    vaos.forEach(function (v) {
      v.forEach(function (c) {
        var lst = F.celulas[c + '|' + (+nv)];
        if (!lst || !lst.some(function (o) { return o.estado !== 'vazia'; })) return;
        var pior = lst.slice().sort(function (p, q) { return ESTADOS_MAPA[q.estado].ordem - ESTADOS_MAPA[p.estado].ordem; })[0];
        var esp = Math.max.apply(null, lst.map(function (o) { return o.espacos || 1; }));
        var pos = vaoDe[c], vao = pos.v, i = pos.i;
        // a ocupação extra conta sempre da esquerda para a direita, a partir da morada do sistema
        var paraEsquerda = false;
        var ini = i, fim = i, motivo = '';
        while (fim - ini + 1 < esp) {
          var prox = paraEsquerda ? ini - 1 : fim + 1;
          if (prox < 0 || prox >= vao.length) { motivo = 'precisa de ' + esp + ' espaços a partir da coluna ' + c + ', mas o vão acaba na coluna ' + vao[vao.length - 1]; break; }
          if (temPalete(vao[prox])) { motivo = 'precisa de ' + esp + ' espaços, mas a morada ' + vao[prox] + ' tem outra palete'; break; }
          if (paraEsquerda) ini = prox; else fim = prox;
        }
        var bk = { c: c, lst: lst, pior: pior, esp: esp, colIni: vao[ini], colFim: vao[fim], motivo: motivo };
        for (var j = ini; j <= fim; j++) coberto[vao[j]] = bk;
        if (lst.length > 1) bk.motivo = 'mais de uma morada nesta posição';
        if (sem[c + '|' + (+nv)]) bk.motivo = 'palete numa passagem (posição sem rack)';
        blocos.push(bk);
      });
    });
    // fundo: moradas sem palete (livres, vazias confirmadas, inexistentes)
    vaos.forEach(function (v) {
      v.forEach(function (c) {
        var inex = sem[c + '|' + (+nv)];
        if (!inex && (rack || F.lista) && cols.indexOf(c) >= 0) resumo.posicoes++;
        if (coberto[c]) {
          if (coberto[c].c !== c) {
            var lstC = F.celulas[c + '|' + (+nv)];
            if (lstC) lstC.forEach(function (o) { if (o.estado === 'vazia') coberto[c].absorve = (coberto[c].absorve || []).concat(o.morada); });
          }
          return;
        }
        var lst = F.celulas[c + '|' + (+nv)];
        var st = 'grid-column:' + gcol[c] + ';grid-row:' + row;
        if (lst) { // só vazias confirmadas
          resumo.vazia++;
          html += '<button type="button" class="blk e-vazia" style="' + st + '" data-m="' + h(lst.map(function (o) { return o.morada; }).join(',')) + '" title="' + h(lst[0].morada + ' · vazia confirmada') + '"></button>';
          return;
        }
        if (S.mapaEditar && F.lista) {
          var mor = G.chave + '-' + c + '-' + nv + '-1';
          var pa = S.mapaPend.add[mor], pd = S.mapaPend.del[mor];
          var cls = pa ? 'e-livre pend-add' : pd ? 'e-inex pend-del' : (inex ? 'e-inex' : 'e-livre');
          html += '<span class="cel2 editavel ' + cls + '" style="' + st + '" data-cel="' + h(mor) + '" data-acao="' + (inex ? 'add' : 'del') + '" title="' + h(mor) + (inex ? (pa ? ' · vai ser criada (toque para anular)' : ' · toque para criar esta morada') : (pd ? ' · vai ser apagada (toque para anular)' : ' · toque para apagar esta morada')) + '">' + (pa ? '+' : pd ? '×' : '') + '</span>';
          return;
        }
        html += '<span class="cel2 ' + (inex ? 'e-inex' : 'e-livre') + '" style="' + st + '" title="Coluna ' + c + ' · nível ' + h(nv) + (inex ? ' · passagem (sem posição)' : ' · livre, sem leitura nem palete no sistema') + '"></span>';
      });
    });
    blocos.forEach(function (bk) {
      var o = bk.pior;
      resumo[o.estado]++;
      var gi = gcol[bk.colIni], gf = gcol[bk.colFim];
      resumo.ocupados += Math.abs(gf - gi) + 1;
      var realce = filtro && bk.lst.some(function (x) { return x.morada.toLowerCase().indexOf(filtro) >= 0 || x.sscc.join(' ').indexOf(filtro) >= 0; });
      var tipo = o.tipo || (o.paletes && o.paletes[0] && o.paletes[0].tipo);
      var corTipo = bk.esp > 1 ? (CORES_TIPO[Math.min(4, bk.esp)] || '#1F5FA8') : '';
      var tit = bk.lst.map(function (x) { return x.morada + ' · ' + ESTADOS_MAPA[x.estado].nome + (x.paletes && x.paletes.length ? ' · ' + x.paletes.map(function (p) { return p.tipo.nome + ' (' + p.tipo.espacos + ' esp.)'; }).join(' + ') : ''); }).join('\n') +
        (bk.colIni !== bk.colFim ? '\nOcupa as moradas das colunas ' + bk.colIni + ' a ' + bk.colFim : '') +
        (bk.absorve ? '\n' + bk.absorve.join(', ') + ' lida como vazia (coberta por esta palete)' : '') +
        (bk.motivo ? '\nAtenção: ' + bk.motivo : '');
      html += '<button type="button" class="blk e-' + o.estado + (bk.motivo ? ' conflito' : '') + (realce ? ' realce' : '') + '" style="grid-column:' + Math.min(gi, gf) + ' / ' + (Math.max(gi, gf) + 1) + ';grid-row:' + row + '" data-m="' + h(bk.lst.map(function (x) { return x.morada; }).join(',')) + '" title="' + h(tit) + '" aria-label="' + h(tit) + '">' +
        (bk.colIni !== bk.colFim && tipo ? '<span class="blk-tipo">' + h(tipo.codigo) + '</span>' : '') +
        (corTipo ? '<i class="faixa" style="background:' + corTipo + '"></i>' : '') + '</button>';
    });
  });
  html += '</div></div>';
  return html;
}

function detalheMorada(lista, M) {
  var html = lista.map(function (m) {
    var o = M[m];
    var sis = o.linhas.filter(function (l) { return l.moradaSistema === m && l.sscc; });
    var probl = o.linhas.filter(function (l) { return RESULTADOS[l.resultado].div && (l.moradaLida === m || (l.moradaSistema === m && o.lida)); });
    return '<div style="display:flex;flex-direction:column;gap:6px"><div class="segs" style="transform:scale(.8);transform-origin:left">' + segsMorada(m) + '</div>' +
      '<div><span class="pill ' + ({ ok: 'ok', vazia: 'cinza', div: 'err', pend: 'pend' })[o.estado] + '">' + ESTADOS_MAPA[o.estado].nome + '</span>' +
      ((o.paletes || []).length ? ' <span class="pill azul">' + o.paletes.map(function (p) { return h(p.tipo.nome) + ' · ' + p.tipo.espacos + (p.tipo.espacos === 1 ? ' espaço' : ' espaços'); }).join(' + ') + '</span>' : '') +
      (o.lida ? ' <span class="muted pequeno">conferida por ' + h(o.operador) + ' às ' + hora(o.dataHora) + '</span>' : '') + '</div>' +
      '<table class="t"><tbody>' +
      '<tr><td class="muted">Lido</td><td class="cod pequeno">' + (o.lida ? (o.vazia ? 'Vazia' : o.sscc.map(h).join('<br>')) : '—') + '</td></tr>' +
      '<tr><td class="muted">Sistema</td><td class="pequeno">' + (sis.length ? sis.map(function (l) { return '<span class="cod">' + h(l.sscc) + '</span><br><span class="muted">' + h((l.tipoPalete ? l.tipoPalete + ' · ' : '') + (l.artigos || '')).substring(0, 160) + '</span>'; }).join('<br>') : (S.res.temReferencia ? 'Vazia no sistema' : 'Ficheiro do sistema por carregar')) + '</td></tr>' +
      (probl.length ? '<tr><td class="muted">Divergência</td><td class="pequeno">' + probl.map(function (l) {
        return '<b>' + h(RESULTADOS[l.resultado].nome) + '</b> · <span class="cod">' + h(l.sscc) + '</span>' + (l.resultado === 'FORA_SITIO' ? (l.moradaLida === m ? ' (no sistema em ' + h(l.moradaSistema) + ')' : ' (encontrada em ' + h(l.moradaLida) + ')') : '');
      }).join('<br>') + '</td></tr>' : '') +
      '</tbody></table></div>';
  }).join('<hr style="border:0;border-top:1px solid var(--linha);width:100%">');
  modal({ titulo: lista.length > 1 ? lista.length + ' moradas nesta posição' : 'Detalhe da morada', html: html, botoes: [{ t: 'Fechar', c: 'prim' }] });
}


/* ---------- editar moradas no mapa ---------- */
function ligarEdicaoMapa(el, filtro) {
  if (S.ecra !== 'boMapa') return;
  var redesenhar = function () { var y = window.scrollY; pintarMapa(el, filtro); window.scrollTo(0, y); };
  var b = el.querySelector('#btEditar');
  if (b) b.onclick = function () { S.mapaEditar = true; S.mapaPend = { add: {}, del: {} }; redesenhar(); };
  var sair = el.querySelector('#btSairEd');
  if (sair) sair.onclick = function () { S.mapaEditar = false; S.mapaPend = { add: {}, del: {} }; redesenhar(); };
  var nova = el.querySelector('#btNovaMor');
  if (nova) nova.onclick = function () {
    var l = extrairMoradas(el.querySelector('#novaMor').value);
    if (!l.length) { modal({ titulo: 'Morada inválida', texto: 'Escreva a morada completa, por exemplo 04-SL-100-12-40-1.', classe: 'aviso' }); return; }
    var existentes = {}; ((S.res.armazem && S.res.armazem.moradas) || []).forEach(function (m) { existentes[m] = 1; });
    l.forEach(function (m) { if (!existentes[m]) S.mapaPend.add[m] = 1; delete S.mapaPend.del[m]; });
    redesenhar();
  };
  Array.prototype.forEach.call(el.querySelectorAll('[data-cel]'), function (c) {
    c.onclick = function () {
      var m = c.dataset.cel, P = S.mapaPend;
      if (c.dataset.acao === 'add') { if (P.add[m]) delete P.add[m]; else P.add[m] = 1; }
      else { if (P.del[m]) delete P.del[m]; else P.del[m] = 1; }
      redesenhar();
    };
  });
  var g = el.querySelector('#btGuardarEd');
  if (g) g.onclick = function () {
    var add = Object.keys(S.mapaPend.add), del = Object.keys(S.mapaPend.del);
    modal({ titulo: 'Guardar alterações às moradas?',
      html: (add.length ? '<div><b>Criar ' + add.length + ':</b> <span class="cod pequeno">' + add.slice(0, 30).map(h).join(', ') + (add.length > 30 ? '…' : '') + '</span></div>' : '') +
        (del.length ? '<div><b>Apagar ' + del.length + ':</b> <span class="cod pequeno">' + del.slice(0, 30).map(h).join(', ') + (del.length > 30 ? '…' : '') + '</span></div>' : ''),
      botoes: [{ t: 'Guardar', c: 'prim', f: function () {
        var p = Promise.resolve();
        if (add.length) p = p.then(function () { return api('importarMoradas', add, nomeBo(), 'adicionar'); });
        if (del.length) p = p.then(function () { return api('removerMoradas', del, nomeBo()); });
        p.then(function () { S.mapaEditar = false; S.mapaPend = { add: {}, del: {} }; carregarMapaArmazem(); })
          .catch(function (e) { modal({ titulo: 'Erro ao guardar', texto: e.message, classe: 'erro' }); });
      } }, { t: 'Continuar a editar' }] });
  };
}
/* ---------- carregar o ficheiro do sistema (Excel exportado) ---------- */
function carregarXlsxLib() {
  return new Promise(function (res, rej) {
    if (window.XLSX) return res();
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function () { res(); }; s.onerror = function () { rej(new Error('Não foi possível carregar o leitor de Excel. Verifique a ligação à internet.')); };
    document.head.appendChild(s);
  });
}
function semAcentos(t) { return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function acharColuna(cabs, nomes) {
  for (var i = 0; i < nomes.length; i++) for (var j = 0; j < cabs.length; j++) if (semAcentos(cabs[j]) === nomes[i]) return cabs[j];
  return null;
}
function interpretarLinhas(rows) {
  if (!rows.length) throw new Error('O ficheiro está vazio.');
  var cabs = Object.keys(rows[0]);
  var col = {
    sscc: acharColuna(cabs, ['sscc', 'palete', 'n palete']),
    morada: acharColuna(cabs, ['address', 'morada', 'endereco', 'localizacao', 'location']),
    tipo: acharColuna(cabs, ['note', 'tipo palete', 'suporte']),
    familia: acharColuna(cabs, ['type', 'familia']),
    ref: acharColuna(cabs, ['product code', 'referencia', 'ref', 'codigo']),
    nome: acharColuna(cabs, ['product name', 'designacao', 'descricao', 'artigo']),
    qty: acharColuna(cabs, ['qty', 'quantidade', 'qtd'])
  };
  if (!col.sscc || !col.morada) throw new Error('Não encontrei as colunas SSCC e Address (morada). Colunas no ficheiro: ' + cabs.join(', '));
  var mapa = {}, invalidos = 0, semMorada = 0;
  rows.forEach(function (r) {
    var bruto = String(r[col.sscc] || '').trim();
    if (!bruto) return;
    var s = normalizarSscc(bruto);
    if (!s) { invalidos++; return; }
    var m = normalizarMorada(r[col.morada]);
    if (!m) { semMorada++; return; }
    var k = s + '|' + m;
    var p = mapa[k] = mapa[k] || { sscc: s, morada: m, tipo: col.tipo ? String(r[col.tipo]).split(';')[0] : '', familias: {}, artigos: [], qtdTotal: 0 };
    var q = col.qty ? parseFloat(String(r[col.qty]).replace(',', '.')) || 0 : 0;
    p.qtdTotal += q;
    if (col.familia && r[col.familia]) p.familias[r[col.familia]] = 1;
    p.artigos.push((col.ref ? r[col.ref] + ' ' : '') + (col.nome ? r[col.nome] : '') + (q ? ' ×' + q : ''));
  });
  var linhas = Object.keys(mapa).map(function (k) {
    var p = mapa[k];
    var fam = Object.keys(p.familias).join(', ');
    return { sscc: p.sscc, morada: p.morada, tipo: p.tipo, numArtigos: p.artigos.length, qtdTotal: p.qtdTotal || '', artigos: (fam ? fam + ' · ' : '') + p.artigos.join('; ') };
  });
  return { linhas: linhas, invalidos: invalidos, semMorada: semMorada, totalLinhas: rows.length,
    moradas: Object.keys(linhas.reduce(function (o, l) { o[l.morada] = 1; return o; }, {})).length };
}
function adivinharLoja(nome) {
  var n = chaveLoja_(nome).replace(/[^a-z]/g, ' ');
  return (CFG.lojas || []).filter(function (l) { return n.indexOf(chaveLoja_(l).replace(/[^a-z]/g, ' ')) >= 0; })[0] || '';
}
function lerFicheiroSistema(file, lojaPedida) {
  var m = modal({ titulo: 'A ler ' + file.name + '…', texto: 'Um momento.', botoes: [] });
  carregarXlsxLib().then(function () {
    return file.arrayBuffer();
  }).then(function (buf) {
    var wb = XLSX.read(buf, { type: 'array', raw: false, cellText: true });
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(ws, { raw: false, defval: '' });
    var info = interpretarLinhas(rows);
    m.fechar();
    var mult = info.linhas.length - info.moradas;
    var cor = (S.res && S.res.contagem && S.res.contagem.corredores) || [];
    var dentro = info.linhas.filter(function (l) { return dentroDosCorredores(l.morada, cor); });
    var lojaSug = lojaPedida || adivinharLoja(file.name);
    modal({ titulo: 'Confirmar ficheiro do sistema',
      html: '<div><b>' + h(file.name) + '</b></div><table class="t"><tbody>' +
        '<tr><td>Linhas no ficheiro</td><td class="num"><b>' + info.totalLinhas + '</b></td></tr>' +
        '<tr><td>Paletes (SSCC) no ficheiro</td><td class="num"><b>' + info.linhas.length + '</b></td></tr>' +
        (cor.length ? '<tr><td>Paletes em ' + h(nomeCorredores(cor)) + '</td><td class="num"><b>' + dentro.length + '</b></td></tr>' : '') +
        '<tr><td>Moradas ocupadas</td><td class="num"><b>' + info.moradas + '</b></td></tr>' +
        (mult > 0 ? '<tr><td>Paletes partilhando morada</td><td class="num">' + mult + '</td></tr>' : '') +
        (info.invalidos ? '<tr><td style="color:var(--erro)">SSCC inválidos (ignorados)</td><td class="num">' + info.invalidos + '</td></tr>' : '') +
        (info.semMorada ? '<tr><td style="color:var(--erro)">Paletes sem morada (ignoradas)</td><td class="num">' + info.semMorada + '</td></tr>' : '') +
        '</tbody></table>' +
        '<div class="campo"><label for="inLojaFich">Loja deste ficheiro</label><select id="inLojaFich"><option value="">Escolha a loja…</option>' +
        (CFG.lojas || []).map(function (l) { return '<option' + (chaveLoja_(l) === chaveLoja_(lojaSug) ? ' selected' : '') + '>' + h(l) + '</option>'; }).join('') + '</select></div>' +
        '<div class="muted pequeno">Substitui o ficheiro anterior desta loja. Só entram as paletes dos corredores da auditoria. As leituras dos operadores não são alteradas.</div>',
      botoes: [{ t: 'Carregar e comparar', c: 'prim', f: function (elM) {
        var loja = $('#inLojaFich', elM).value;
        if (!loja && cor.length) { modal({ titulo: 'Escolha a loja', texto: 'Indique de que loja é o ficheiro ' + file.name + ' e volte a carregá-lo.', classe: 'aviso' }); return; }
        var enviar = cor.length ? dentro : info.linhas;
        if (!enviar.length) { modal({ titulo: 'Sem paletes nestes corredores', texto: 'O ficheiro de ' + loja + ' não tem paletes em ' + nomeCorredores(cor) + '.', classe: 'aviso' }); return; }
        var m2 = modal({ titulo: 'A guardar…', texto: enviar.length + ' paletes de ' + loja + '.', botoes: [] });
        api('carregarReferencia', S.boId, file.name, enviar, nomeBo(), loja).then(function () { m2.fechar(); S.boTab = 'div'; carregarDetalhe(); })
          .catch(function (e) { m2.fechar(); modal({ titulo: 'Erro ao guardar', texto: e.message, classe: 'erro' }); });
      } }, { t: 'Cancelar' }] });
  }).catch(function (e) { m.fechar(); modal({ titulo: 'Não foi possível ler o ficheiro', texto: e.message, classe: 'erro' }); });
}

/* ---------- encerrar e relatório ---------- */
function encerrarUI() {
  var r = S.res, s = r.resumo;
  var avisos = [];
  if (!r.temReferencia) avisos.push('Ainda não carregou o ficheiro do sistema: o relatório só terá as leituras.');
  if (s.moradasNaoConferidas) avisos.push(s.moradasNaoConferidas + ' moradas com paletes no sistema ainda não foram conferidas.');
  var pend = S.fila.filter(function (f) { return f.contagemId === S.boId; }).length;
  modal({ titulo: 'Encerrar a auditoria?', classe: avisos.length ? 'aviso' : '',
    html: '<div>Os operadores deixam de poder registar leituras. O resultado fica guardado na aba Resultados e é gerado o relatório PDF.</div>' +
      (avisos.length ? '<div class="msg av" style="font-size:14px;flex-direction:column;gap:4px">' + avisos.map(function (a) { return '<div>' + h(a) + '</div>'; }).join('') + '</div>' : '') +
      (pend ? '<div class="msg err" style="font-size:14px">Este dispositivo tem ' + pend + ' leituras por enviar.</div>' : ''),
    botoes: [{ t: 'Encerrar e gerar relatório', c: 'prim', f: function () { gerarRelatorioUI(true); } }, { t: 'Cancelar' }] });
}
function eliminarUI() {
  var c = S.res.contagem, s = S.res.resumo;
  modal({ titulo: 'Eliminar a auditoria?', classe: 'erro',
    html: '<div><b>' + h(c.loja) + ' · ' + h(c.data) + '</b> <span class="muted cod pequeno">' + h(c.id) + '</span></div>' +
      '<div>São apagadas definitivamente ' + s.moradasConferidas + ' moradas lidas, o ficheiro do sistema carregado e os resultados. Não é possível desfazer.</div>' +
      (c.relatorioUrl ? '<div class="muted pequeno">O PDF já gerado fica na pasta da Drive.</div>' : '') +
      '<div class="campo"><label for="inConfElim">Para confirmar, escreva ELIMINAR</label><input id="inConfElim" autocomplete="off"></div>',
    botoes: [{ t: 'Cancelar', c: 'prim' }, { t: 'Eliminar definitivamente', c: 'perigo', f: function (el) {
      if ($('#inConfElim', el).value.trim().toUpperCase() !== 'ELIMINAR') { modal({ titulo: 'Contagem não eliminada', texto: 'A palavra de confirmação não estava correta.', classe: 'aviso' }); return; }
      api('eliminarContagem', S.boId, nomeBo()).then(function () {
        clearInterval(S.tBo); S.boId = null; S.ecra = 'boLista'; render();
      }).catch(function (e) { modal({ titulo: 'Erro ao eliminar', texto: e.message, classe: 'erro' }); });
    } }] });
}
function gerarRelatorioUI(encerrar) {
  var m = modal({ titulo: encerrar ? 'A encerrar a auditoria…' : 'A gerar o relatório…', texto: !MODO_DEMO ? 'A criar o PDF na Drive. Pode demorar alguns segundos.' : 'Um momento.', botoes: [] });
  api(encerrar ? 'encerrarContagem' : 'gerarRelatorio', S.boId, nomeBo()).then(function (r) {
    m.fechar();
    var iframeHtml = '<iframe title="Pré-visualização do relatório" srcdoc="' + h(r.html) + '"></iframe>';
    modal({ titulo: 'Relatório da auditoria', classe: 'larga', lado: true,
      html: (r.url ? '<div class="msg ok" style="font-size:14px">PDF guardado na Drive: <a href="' + h(r.url) + '" target="_blank" rel="noopener">abrir ' + h(r.nome) + '</a></div>'
        : '<div class="msg info" style="font-size:14px">Pré-visualização. Na versão instalada no Google Sheets, este relatório é guardado em PDF numa pasta da Drive.</div>') + iframeHtml,
      botoes: [{ t: 'Fechar', c: 'prim' }] });
    carregarDetalhe();
  }).catch(function (e) { m.fechar(); modal({ titulo: 'Erro', texto: e.message, classe: 'erro' }); });
}

iniciar();
</script>
